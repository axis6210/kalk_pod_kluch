<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КП · Плитка</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg:      #eef0f4;
  --card:    #ffffff;
  --brd:     #e0e4ec;
  --brd2:    #c8cfd9;
  --navy:    #1a3560;
  --blue:    #2454a4;
  --blue-l:  #e8eef8;
  --amber:   #c97c10;
  --amber-l: #fff8e8;
  --purple:  #6b35c4;
  --purple-l:#f2ecff;
  --teal:    #0e7a6b;
  --teal-l:  #e6f5f3;
  --green:   #15803d;
  --red:     #c0392b;
  --t1:      #111827;
  --t2:      #4b5563;
  --t3:      #9ca3af;
  --sh:      0 1px 3px rgba(0,0,0,.08);
  --r:       8px; --r2: 5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;font-size:13px;min-height:100vh;padding-bottom:50px}

/* ══ TOP BAR ═══════════════════════════════════════════════ */
.top{background:var(--navy);padding:12px 14px;position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top-ttl{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.top-sum{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;color:#fff}

/* ══ META ═══════════════════════════════════════════════════ */
.meta{margin:10px 10px 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  border-left:3px solid var(--amber);overflow:hidden}
.mrow{display:flex;align-items:center;padding:8px 12px;gap:8px;border-bottom:1px solid var(--brd)}
.mrow:last-child{border-bottom:none}
.mlbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;min-width:68px}
.minp{flex:1;border:none;outline:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--t1);background:transparent}
.minp::placeholder{color:var(--t3)}

/* ══ ROOM ═══════════════════════════════════════════════════ */
.room{margin:10px 10px 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.room-hd{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--navy);cursor:pointer}
.room-nm{flex:1;border:none;outline:none;background:transparent;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#fff}
.room-nm::placeholder{color:rgba(255,255,255,.35)}
.room-tot{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
.room-del{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);
  font-size:18px;padding:0 2px;line-height:1;transition:color .15s}
.room-del:hover{color:#fca5a5}
.chev{color:rgba(255,255,255,.4);font-size:10px;transition:transform .2s}
.room.cls .chev{transform:rotate(-90deg)}
.room.cls .room-body{display:none}

/* ══ SECTION TOGGLE ROW ══════════════════════════════════════ */
.sec-row{display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--brd);cursor:pointer;user-select:none;background:var(--card)}
.sec-ico{font-size:15px;line-height:1}
.sec-lbl{flex:1;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t2)}
.sec-badge{font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace}
/* toggle */
.sw{position:relative;width:34px;height:20px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.swt{position:absolute;inset:0;background:var(--brd2);border-radius:10px;cursor:pointer;transition:background .2s}
.sw input:checked+.swt{background:var(--blue)}
.swt::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;
  background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+.swt::after{transform:translateX(14px)}

.sec-body{display:none;border-bottom:1px solid var(--brd)}
.sec-body.open{display:block}

/* ══ SURFACE CARD ════════════════════════════════════════════ */
.sc{background:#f8f9fb;border:1px solid var(--brd);border-radius:var(--r2);
  margin:8px 10px;overflow:hidden}
.sc.floor{border-left:3px solid var(--amber)}
.sc.wall{border-left:3px solid var(--blue)}
.sc.trim{border-left:3px solid var(--purple)}
.sc.shower{border-left:3px solid var(--teal)}

.sc-head{display:flex;align-items:center;gap:6px;padding:6px 10px;
  border-bottom:1px solid var(--brd)}
.sc-head.floor-h{background:var(--amber-l)}
.sc-head.wall-h{background:var(--blue-l)}
.sc-head.trim-h{background:var(--purple-l)}
.sc-head.shower-h{background:var(--teal-l)}
.sc-head-lbl{flex:1;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sc-head.floor-h .sc-head-lbl{color:var(--amber)}
.sc-head.wall-h .sc-head-lbl{color:var(--blue)}
.sc-head.trim-h .sc-head-lbl{color:var(--purple)}
.sc-head.shower-h .sc-head-lbl{color:var(--teal)}
.sc-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:15px;line-height:1;padding:0}
.sc-del:hover{color:var(--red)}

.sr{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--brd)}
.sr:last-child{border-bottom:none}
.slbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;min-width:42px}
.sinp{flex:1;border:none;outline:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--t1);background:transparent}
.sinp::placeholder{color:var(--t3)}
.snum{border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px;
  color:var(--t1);background:transparent;width:62px;text-align:right}
.sunit{font-size:11px;color:var(--t2);white-space:nowrap}
.sprice{border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--blue);background:transparent;width:58px;text-align:right}

/* ══ EXTRAS BLOCK ════════════════════════════════════════════ */
.ex-block{background:#f0f2f6;border-top:1px solid var(--brd)}
.ex-ttl{padding:5px 10px;font-size:10px;font-weight:700;color:var(--t3);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--brd)}
.ex-row{display:flex;align-items:center;gap:5px;padding:5px 10px;
  border-bottom:1px solid var(--brd)}
.ex-row:last-child{border-bottom:none}
/* mini switch */
.swm{position:relative;width:28px;height:16px;flex-shrink:0}
.swm input{opacity:0;width:0;height:0;position:absolute}
.swmt{position:absolute;inset:0;background:var(--brd2);border-radius:8px;cursor:pointer;transition:background .2s}
.swm input:checked+.swmt{background:var(--blue)}
.swmt::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;
  background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.swm input:checked+.swmt::after{transform:translateX(12px)}
.ex-nm{flex:1;font-size:12px;color:var(--t2)}
.ex-q{border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--t1);background:transparent;width:52px;text-align:right}
.ex-auto{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);width:52px;text-align:right}
.ex-u{font-size:10px;color:var(--t3);width:28px}
.ex-p{border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--blue);background:transparent;width:46px;text-align:right}
.ex-pu{font-size:10px;color:var(--t3);white-space:nowrap;min-width:28px}
.ex-row.off .ex-nm,.ex-row.off .ex-q,.ex-row.off .ex-p{opacity:.35}

/* ══ ADD WALL ════════════════════════════════════════════════ */
.add-surf{display:flex;align-items:center;gap:6px;margin:0 10px 8px;
  background:none;border:1.5px dashed var(--brd2);border-radius:var(--r2);
  color:var(--t3);font-family:'Inter',sans-serif;font-size:12px;
  padding:8px 12px;cursor:pointer;width:calc(100% - 20px);transition:all .2s}
.add-surf:hover{border-color:var(--blue);color:var(--blue)}

/* ══ POSITIONS TABLE ══════════════════════════════════════════ */
.pos-wrap{border-top:2px solid var(--brd);background:#eef2fa}
.pos-hd{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--brd)}
.pos-hd-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t2)}
.pos-hd-tot{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--navy)}
.pos-row{display:grid;grid-template-columns:18px 1fr 56px 26px 56px 70px;
  gap:2px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--brd)}
.pos-row:last-child{border-bottom:none}
.pos-row:nth-child(odd){background:rgba(255,255,255,.7)}
.pn{font-size:10px;color:var(--t3);text-align:center;font-family:'JetBrains Mono',monospace}
.pname{font-size:11px;color:var(--t1);line-height:1.3}
.pname.sub{color:var(--t2);padding-left:8px}
.pname.sub::before{content:'↳ ';color:var(--t3)}
.pqty{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;color:var(--t1)}
.punit{font-size:10px;color:var(--t3)}
.ppr{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;color:var(--t3)}
.psum{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--navy);text-align:right}

/* ══ ADD ROOM / FOOTER ════════════════════════════════════════ */
.add-room{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px;
  background:var(--card);border:1.5px dashed var(--brd2);border-radius:var(--r);
  color:var(--t2);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  padding:13px;cursor:pointer;width:calc(100% - 20px);box-shadow:var(--sh);transition:all .2s}
.add-room:hover{border-color:var(--blue);color:var(--navy)}

.footer{margin:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;border-top:3px solid var(--navy)}
.ft-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.ft-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.ft-amt{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--navy)}
.ft-hint{padding:0 14px 10px;font-size:11px;color:var(--t3)}
.ft-btns{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--brd)}
.btn{flex:1;padding:11px 8px;border:none;border-radius:var(--r2);
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-p{background:var(--navy);color:#fff}.btn-p:active{background:#0f2040}
.btn-s{background:var(--bg);color:var(--t2);border:1px solid var(--brd2)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;
  padding:9px 22px;border-radius:20px;z-index:999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

input:focus{background:#fffbeb!important;border-radius:2px}
</style>
</head>
<body>

<div class="top">
  <div class="top-ttl">КП · Плиточные работы</div>
  <div class="top-sum" id="topSum">0 ₽</div>
</div>

<div class="meta">
  <div class="mrow">
    <span class="mlbl">Адрес</span>
    <input class="minp" id="mAddr" placeholder="г. Санкт-Петербург, …">
  </div>
  <div class="mrow">
    <span class="mlbl">Заказчик</span>
    <input class="minp" id="mClient" placeholder="ФИО / организация">
  </div>
  <div class="mrow">
    <span class="mlbl">Дата / № КП</span>
    <input class="minp" id="mDate" placeholder="дд.мм.гггг" style="width:100px;flex:none">
    <input class="minp" id="mNum" placeholder="№ —" style="max-width:80px;text-align:right">
  </div>
</div>

<div id="roomsWrap"></div>

<button class="add-room" onclick="addRoom()">＋ Добавить помещение</button>

<div class="footer">
  <div class="ft-row">
    <div class="ft-lbl">Итого без НДС</div>
    <div class="ft-amt" id="footAmt">0 ₽</div>
  </div>
  <div class="ft-hint">НДС не облагается.</div>
  <div class="ft-btns">
    <button class="btn btn-p" onclick="copyKP()">📋 Скопировать КП</button>
    <button class="btn btn-s" onclick="copyTSV()">↓ Excel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let _u = 0;
const uid = () => 'u'+(++_u);

const DEF = { floor:6500, wall:8000, trim:1200, shower:7000,
              cut45:1200, cut:1000, grout:1300, holes:1700 };

function mkExtras(type) {
  const ex = {
    cut45:   {on:false,val:0,price:DEF.cut45},
    cutting: {on:false,val:0,price:DEF.cut},
  };
  if (type!=='trim') ex.grout = {on:false,price:DEF.grout};
  if (type==='floor'||type==='shower') ex.holes = {on:false,val:0,price:DEF.holes};
  return ex;
}

function mkWall() {
  return {id:uid(),label:'',area:0,tile:'',price:DEF.wall, extras:mkExtras('wall')};
}

function mkRoom(name='') {
  return {
    id:uid(), name, collapsed:false,
    floor:  {on:false,area:0,tile:'',price:DEF.floor, extras:mkExtras('floor')},
    wallsOn:false,
    walls:  [mkWall()],
    trim:   {on:false,len:0,tile:'',price:DEF.trim, extras:mkExtras('trim')},
    shower: {on:false,area:0,tile:'',price:DEF.shower, extras:mkExtras('shower')},
  };
}

let rooms = [];

/* ═══════════════════════════════════════════════════════════════
   COMPUTED POSITIONS
═══════════════════════════════════════════════════════════════ */
function tname(verb,tile,suffix) {
  return tile ? `${verb} ${tile}${suffix?' '+suffix:''}` : `${verb} плитки${suffix?' '+suffix:''}`;
}

function exPos(exKey, nm, extras, autoArea) {
  const pos=[];
  const ex=extras;
  if (ex.cut45.on && ex.cut45.val>0)
    pos.push({name:`Рез 45° (${nm})`,qty:ex.cut45.val,unit:'м',price:ex.cut45.price,sub:true});
  if (ex.cutting.on && ex.cutting.val>0)
    pos.push({name:`Подрезы плитки (${nm})`,qty:ex.cutting.val,unit:'пог.м',price:ex.cutting.price,sub:true});
  if (ex.grout && ex.grout.on && autoArea>0)
    pos.push({name:`Затирка (${nm})`,qty:autoArea,unit:'м²',price:ex.grout.price,sub:true});
  if (ex.holes && ex.holes.on && ex.holes.val>0)
    pos.push({name:`Выпиливание отверстий (${nm})`,qty:ex.holes.val,unit:'шт',price:ex.holes.price,sub:true});
  return pos;
}

function getPositions(room) {
  const pos=[];
  // ПОЛ
  if (room.floor.on && room.floor.area>0) {
    pos.push({name:tname('Укладка',room.floor.tile,'на пол'),qty:+room.floor.area,unit:'м²',price:room.floor.price});
    pos.push(...exPos('пол',room.floor.tile||'пол',room.floor.extras,+room.floor.area));
  }
  // СТЕНЫ
  if (room.wallsOn) room.walls.forEach(w=>{
    if (!w.area) return;
    const lbl=w.label||'стены';
    pos.push({name:tname('Укладка',w.tile,w.label?'— '+w.label:'на стены'),qty:+w.area,unit:'м²',price:w.price});
    pos.push(...exPos(lbl,w.tile||lbl,w.extras,+w.area));
  });
  // ОТКОСЫ
  if (room.trim.on && room.trim.len>0) {
    pos.push({name:tname('Откосы дверные',room.trim.tile,''),qty:+room.trim.len,unit:'пог.м',price:room.trim.price});
    pos.push(...exPos('откосы',room.trim.tile||'откосы',room.trim.extras,0));
  }
  // ПОДДОН
  if (room.shower.on && room.shower.area>0) {
    pos.push({name:tname('Укладка',room.shower.tile,'— душевой поддон'),qty:+room.shower.area,unit:'м²',price:room.shower.price});
    pos.push(...exPos('поддон',room.shower.tile||'поддон',room.shower.extras,+room.shower.area));
  }
  return pos;
}

function roomTotal(room) { return getPositions(room).reduce((s,p)=>s+p.qty*p.price,0); }
function grandTotal()    { return rooms.reduce((s,r)=>s+roomTotal(r),0); }

/* ═══════════════════════════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════════════════════════ */
function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function n(v){ return String(v||'').replace(',','.') }

function buildExtras(type, setter, extras, autoArea) {
  const ex = extras;
  const hasGrout = !!ex.grout;
  const hasHoles = !!ex.holes;
  return `
  <div class="ex-block">
    <div class="ex-ttl">⚙ Доп. работы</div>

    <div class="ex-row${ex.cut45.on?'':' off'}">
      <label class="swm" onclick="event.stopPropagation()">
        <input type="checkbox" ${ex.cut45.on?'checked':''}
          onchange="${setter}('cut45','on',this.checked)">
        <div class="swmt"></div>
      </label>
      <span class="ex-nm">Рез 45°</span>
      <input class="ex-q" type="number" min="0" step="0.1"
        value="${ex.cut45.val||''}" placeholder="0"
        onchange="${setter}('cut45','val',+this.value)">
      <span class="ex-u">м</span>
      <span style="font-size:10px;color:var(--t3)">×</span>
      <input class="ex-p" type="number" min="0" step="50"
        value="${ex.cut45.price}"
        onchange="${setter}('cut45','price',+this.value)">
      <span class="ex-pu">₽/м</span>
    </div>

    <div class="ex-row${ex.cutting.on?'':' off'}">
      <label class="swm" onclick="event.stopPropagation()">
        <input type="checkbox" ${ex.cutting.on?'checked':''}
          onchange="${setter}('cutting','on',this.checked)">
        <div class="swmt"></div>
      </label>
      <span class="ex-nm">Подрезы</span>
      <input class="ex-q" type="number" min="0" step="0.1"
        value="${ex.cutting.val||''}" placeholder="0"
        onchange="${setter}('cutting','val',+this.value)">
      <span class="ex-u">пог.м</span>
      <span style="font-size:10px;color:var(--t3)">×</span>
      <input class="ex-p" type="number" min="0" step="50"
        value="${ex.cutting.price}"
        onchange="${setter}('cutting','price',+this.value)">
      <span class="ex-pu">₽/м</span>
    </div>

    ${hasGrout?`
    <div class="ex-row${ex.grout.on?'':' off'}">
      <label class="swm" onclick="event.stopPropagation()">
        <input type="checkbox" ${ex.grout.on?'checked':''}
          onchange="${setter}('grout','on',this.checked)">
        <div class="swmt"></div>
      </label>
      <span class="ex-nm">Затирка</span>
      <span class="ex-auto">${autoArea>0?autoArea.toFixed(2):'авто'}</span>
      <span class="ex-u">м²</span>
      <span style="font-size:10px;color:var(--t3)">×</span>
      <input class="ex-p" type="number" min="0" step="50"
        value="${ex.grout.price}"
        onchange="${setter}('grout','price',+this.value)">
      <span class="ex-pu">₽/м²</span>
    </div>`:''}

    ${hasHoles?`
    <div class="ex-row${ex.holes.on?'':' off'}">
      <label class="swm" onclick="event.stopPropagation()">
        <input type="checkbox" ${ex.holes.on?'checked':''}
          onchange="${setter}('holes','on',this.checked)">
        <div class="swmt"></div>
      </label>
      <span class="ex-nm">Отверстия</span>
      <input class="ex-q" type="number" min="0" step="1"
        value="${ex.holes.val||''}" placeholder="0"
        onchange="${setter}('holes','val',+this.value)">
      <span class="ex-u">шт</span>
      <span style="font-size:10px;color:var(--t3)">×</span>
      <input class="ex-p" type="number" min="0" step="50"
        value="${ex.holes.price}"
        onchange="${setter}('holes','price',+this.value)">
      <span class="ex-pu">₽/шт</span>
    </div>`:''}
  </div>`;
}

function buildWallCard(rid, w) {
  const setter = `setWallEx.bind(null,'${rid}','${w.id}')`;
  return `
  <div class="sc wall" id="wc_${w.id}">
    <div class="sc-head wall-h">
      <span class="sc-head-lbl">Поверхность / зона</span>
      <button class="sc-del" onclick="delWall('${rid}','${w.id}')">×</button>
    </div>
    <div class="sr">
      <span class="slbl">Назв.</span>
      <input class="sinp" placeholder="осн. стена / фартук / декор / ниша…"
        value="${e(w.label)}" onchange="setWallProp('${rid}','${w.id}','label',this.value)">
    </div>
    <div class="sr">
      <span class="slbl">Плитка</span>
      <input class="sinp" placeholder="60×120 керамогранит / декор / …"
        value="${e(w.tile)}" onchange="setWallProp('${rid}','${w.id}','tile',this.value)">
    </div>
    <div class="sr">
      <span class="slbl">Пл-дь</span>
      <input class="snum" type="number" min="0" step="0.01"
        value="${w.area||''}" placeholder="0"
        onchange="setWallProp('${rid}','${w.id}','area',+this.value)">
      <span class="sunit">м²</span>
      <span style="padding:0 5px;color:var(--t3);font-size:11px">·</span>
      <input class="sprice" type="number" min="0" step="100"
        value="${w.price}"
        onchange="setWallProp('${rid}','${w.id}','price',+this.value)">
      <span class="sunit">₽/м²</span>
    </div>
    ${buildExtras('wall',setter,w.extras,+w.area)}
  </div>`;
}

function buildPosTable(room) {
  const pos = getPositions(room);
  if (!pos.length) return '';
  const tot = pos.reduce((s,p)=>s+p.qty*p.price,0);
  return `
  <div class="pos-wrap" id="pos_${room.id}">
    <div class="pos-hd">
      <span class="pos-hd-lbl">Позиции КП</span>
      <span class="pos-hd-tot">${fmt(tot)} ₽</span>
    </div>
    ${pos.map((p,i)=>`
    <div class="pos-row">
      <span class="pn">${p.sub?'':i+1}</span>
      <span class="pname${p.sub?' sub':''}">${e(p.name)}</span>
      <span class="pqty">${fmtQ(p.qty)}</span>
      <span class="punit">${p.unit}</span>
      <span class="ppr">${fmt(p.price)}</span>
      <span class="psum">${fmt(p.qty*p.price)}</span>
    </div>`).join('')}
  </div>`;
}

function buildRoom(room) {
  const tot = roomTotal(room);
  const rid = room.id;

  // badges
  const flBadge = room.floor.on&&room.floor.area ? room.floor.area+'м²' : '';
  const wBadge  = room.wallsOn&&room.walls.some(w=>w.area)
    ? room.walls.reduce((s,w)=>s+(+w.area),0).toFixed(2)+'м²' : '';
  const trBadge = room.trim.on&&room.trim.len ? room.trim.len+'п.м' : '';
  const shBadge = room.shower.on&&room.shower.area ? room.shower.area+'м²' : '';

  // floor extras setter
  const flEx = `setFloorEx.bind(null,'${rid}')`;
  const shEx = `setShowerEx.bind(null,'${rid}')`;
  const trEx = `setTrimEx.bind(null,'${rid}')`;

  const el = document.createElement('div');
  el.className = 'room'+(room.collapsed?' cls':'');
  el.id = 'room_'+rid;

  el.innerHTML = `
  <div class="room-hd" onclick="toggleRoom('${rid}')">
    <input class="room-nm" value="${e(room.name)}" placeholder="Название помещения…"
      onclick="event.stopPropagation()"
      onchange="setRoomName('${rid}',this.value)">
    <span class="room-tot" id="rtot_${rid}">${fmt(tot)} ₽</span>
    <button class="room-del" onclick="event.stopPropagation();delRoom('${rid}')">×</button>
    <span class="chev">▼</span>
  </div>

  <div class="room-body">

  <!-- ПОЛ ─────────────────────────────────────────────── -->
  <div class="sec-row" onclick="togSec(event,'${rid}','floor')">
    <span class="sec-ico">⬜</span>
    <span class="sec-lbl">Пол</span>
    <span class="sec-badge" id="fb_${rid}">${flBadge}</span>
    <label class="sw" onclick="event.stopPropagation()">
      <input type="checkbox" ${room.floor.on?'checked':''}
        onchange="setFloorOn('${rid}',this.checked)">
      <div class="swt"></div>
    </label>
  </div>
  <div class="sec-body${room.floor.on?' open':''}" id="fbd_${rid}">
    <div class="sc floor" style="margin-top:8px">
      <div class="sc-head floor-h"><span class="sc-head-lbl">Пол</span></div>
      <div class="sr">
        <span class="slbl">Плитка</span>
        <input class="sinp" placeholder="60×120 керамогранит / мозаика / …"
          value="${e(room.floor.tile)}"
          onchange="setFloor('${rid}','tile',this.value)">
      </div>
      <div class="sr">
        <span class="slbl">Пл-дь</span>
        <input class="snum" type="number" min="0" step="0.01"
          value="${room.floor.area||''}" placeholder="0"
          onchange="setFloor('${rid}','area',+this.value)">
        <span class="sunit">м²</span>
        <span style="padding:0 5px;color:var(--t3);font-size:11px">·</span>
        <input class="sprice" type="number" min="0" step="100"
          value="${room.floor.price}"
          onchange="setFloor('${rid}','price',+this.value)">
        <span class="sunit">₽/м²</span>
      </div>
      ${buildExtras('floor',flEx,room.floor.extras,+room.floor.area)}
    </div>
  </div>

  <!-- СТЕНЫ ────────────────────────────────────────────── -->
  <div class="sec-row" onclick="togSec(event,'${rid}','walls')">
    <span class="sec-ico">🪟</span>
    <span class="sec-lbl">Стены</span>
    <span class="sec-badge" id="wb_${rid}">${wBadge}</span>
    <label class="sw" onclick="event.stopPropagation()">
      <input type="checkbox" ${room.wallsOn?'checked':''}
        onchange="setWallsOn('${rid}',this.checked)">
      <div class="swt"></div>
    </label>
  </div>
  <div class="sec-body${room.wallsOn?' open':''}" id="wbd_${rid}">
    <div id="walls_${rid}" style="margin-top:4px">
      ${room.walls.map(w=>buildWallCard(rid,w)).join('')}
    </div>
    <button class="add-surf" onclick="addWall('${rid}')">＋ другой формат / поверхность</button>
  </div>

  <!-- ОТКОСЫ ───────────────────────────────────────────── -->
  <div class="sec-row" onclick="togSec(event,'${rid}','trim')">
    <span class="sec-ico">🚪</span>
    <span class="sec-lbl">Откосы дверные</span>
    <span class="sec-badge" id="tb_${rid}">${trBadge}</span>
    <label class="sw" onclick="event.stopPropagation()">
      <input type="checkbox" ${room.trim.on?'checked':''}
        onchange="setTrimOn('${rid}',this.checked)">
      <div class="swt"></div>
    </label>
  </div>
  <div class="sec-body${room.trim.on?' open':''}" id="tbd_${rid}">
    <div class="sc trim" style="margin-top:8px">
      <div class="sc-head trim-h"><span class="sc-head-lbl">Откосы дверные</span></div>
      <div class="sr">
        <span class="slbl">Плитка</span>
        <input class="sinp" placeholder="формат / марка плитки"
          value="${e(room.trim.tile)}"
          onchange="setTrim('${rid}','tile',this.value)">
      </div>
      <div class="sr">
        <span class="slbl">Длина</span>
        <input class="snum" type="number" min="0" step="0.1"
          value="${room.trim.len||''}" placeholder="0"
          onchange="setTrim('${rid}','len',+this.value)">
        <span class="sunit">пог.м</span>
        <span style="padding:0 5px;color:var(--t3);font-size:11px">·</span>
        <input class="sprice" type="number" min="0" step="100"
          value="${room.trim.price}"
          onchange="setTrim('${rid}','price',+this.value)">
        <span class="sunit">₽/п.м</span>
      </div>
      ${buildExtras('trim',trEx,room.trim.extras,0)}
    </div>
  </div>

  <!-- ПОДДОН ────────────────────────────────────────────── -->
  <div class="sec-row" onclick="togSec(event,'${rid}','shower')">
    <span class="sec-ico">🚿</span>
    <span class="sec-lbl">Поддон душевой</span>
    <span class="sec-badge" id="shb_${rid}">${shBadge}</span>
    <label class="sw" onclick="event.stopPropagation()">
      <input type="checkbox" ${room.shower.on?'checked':''}
        onchange="setShowerOn('${rid}',this.checked)">
      <div class="swt"></div>
    </label>
  </div>
  <div class="sec-body${room.shower.on?' open':''}" id="shbd_${rid}">
    <div class="sc shower" style="margin-top:8px">
      <div class="sc-head shower-h"><span class="sc-head-lbl">Душевой поддон</span></div>
      <div class="sr">
        <span class="slbl">Плитка</span>
        <input class="sinp" placeholder="формат / мозаика / …"
          value="${e(room.shower.tile)}"
          onchange="setShower('${rid}','tile',this.value)">
      </div>
      <div class="sr">
        <span class="slbl">Пл-дь</span>
        <input class="snum" type="number" min="0" step="0.01"
          value="${room.shower.area||''}" placeholder="0"
          onchange="setShower('${rid}','area',+this.value)">
        <span class="sunit">м²</span>
        <span style="padding:0 5px;color:var(--t3);font-size:11px">·</span>
        <input class="sprice" type="number" min="0" step="100"
          value="${room.shower.price}"
          onchange="setShower('${rid}','price',+this.value)">
        <span class="sunit">₽/м²</span>
      </div>
      ${buildExtras('shower',shEx,room.shower.extras,+room.shower.area)}
    </div>
  </div>

  <!-- КП ПОЗИЦИИ ──────────────────────────────────────── -->
  ${buildPosTable(room)}

  </div>`;
  return el;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER / UPDATE
═══════════════════════════════════════════════════════════════ */
function render() {
  const wrap = document.getElementById('roomsWrap');
  wrap.innerHTML = '';
  rooms.forEach(r => wrap.appendChild(buildRoom(r)));
  updateTotals();
}

function reRoom(id) {
  const room = rooms.find(r=>r.id===id);
  const old = document.getElementById('room_'+id);
  if (!old) return;
  const neo = buildRoom(room);
  old.replaceWith(neo);
  updateTotals();
}

function calcRoom(id) {
  // partial: only update totals + positions table, preserve focus
  const room = rooms.find(r=>r.id===id);
  const tot = roomTotal(room);
  const el = document.getElementById('rtot_'+id);
  if (el) el.textContent = fmt(tot)+' ₽';
  // pos table
  const posOld = document.getElementById('pos_'+id);
  const newHtml = buildPosTable(room);
  if (newHtml) {
    const tmp = document.createElement('div');
    tmp.innerHTML = newHtml;
    const newEl = tmp.firstElementChild;
    if (posOld) posOld.replaceWith(newEl);
    else document.getElementById('room_'+id)?.querySelector('.room-body')?.insertAdjacentElement('beforeend',newEl);
  } else {
    if (posOld) posOld.remove();
  }
  // badges
  const room2 = rooms.find(r=>r.id===id);
  const fb = document.getElementById('fb_'+id);
  if (fb) fb.textContent = room2.floor.on&&room2.floor.area?room2.floor.area+'м²':'';
  const wb = document.getElementById('wb_'+id);
  if (wb) {
    const tot2=room2.wallsOn?room2.walls.reduce((s,w)=>s+(+w.area),0):0;
    wb.textContent=tot2?tot2.toFixed(2)+'м²':'';
  }
  const tb = document.getElementById('tb_'+id);
  if (tb) tb.textContent=room2.trim.on&&room2.trim.len?room2.trim.len+'п.м':'';
  const shb = document.getElementById('shb_'+id);
  if (shb) shb.textContent=room2.shower.on&&room2.shower.area?room2.shower.area+'м²':'';
  updateTotals();
}

function updateTotals() {
  const g = grandTotal();
  document.getElementById('topSum').textContent = fmt(g)+' ₽';
  document.getElementById('footAmt').textContent = fmt(g)+' ₽';
}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS — rooms
═══════════════════════════════════════════════════════════════ */
function addRoom() {
  const r = mkRoom();
  rooms.push(r);
  const wrap = document.getElementById('roomsWrap');
  wrap.appendChild(buildRoom(r));
  updateTotals();
  setTimeout(()=>{
    const inp=document.querySelector('#room_'+r.id+' .room-nm');
    if(inp)inp.focus();
  },60);
}

function delRoom(id) {
  rooms=rooms.filter(r=>r.id!==id);
  document.getElementById('room_'+id)?.remove();
  updateTotals();
}

function toggleRoom(id) {
  const r=rooms.find(r=>r.id===id);
  r.collapsed=!r.collapsed;
  const el=document.getElementById('room_'+id);
  el.classList.toggle('cls',r.collapsed);
}

function setRoomName(id,val) {
  rooms.find(r=>r.id===id).name=val;
}

function togSec(ev,rid,sec) {
  if(ev.target.closest('.sw')) return;
  const r=rooms.find(r=>r.id===rid);
  if(sec==='floor')  { r.floor.on=!r.floor.on;   setFloorOn(rid,r.floor.on); return; }
  if(sec==='walls')  { r.wallsOn=!r.wallsOn;       setWallsOn(rid,r.wallsOn); return; }
  if(sec==='trim')   { r.trim.on=!r.trim.on;       setTrimOn(rid,r.trim.on); return; }
  if(sec==='shower') { r.shower.on=!r.shower.on;   setShowerOn(rid,r.shower.on); return; }
}

/* ── Floor ── */
function setFloorOn(rid,v){ rooms.find(r=>r.id===rid).floor.on=v; reRoom(rid); }
function setFloor(rid,f,v){
  rooms.find(r=>r.id===rid).floor[f]=v; calcRoom(rid);
}
function setFloorEx(rid,key,field,val){
  rooms.find(r=>r.id===rid).floor.extras[key][field]=val;
  if(field==='on') reRoom(rid); else calcRoom(rid);
}

/* ── Walls ── */
function setWallsOn(rid,v){ rooms.find(r=>r.id===rid).wallsOn=v; reRoom(rid); }
function setWallProp(rid,wid,f,v){
  rooms.find(r=>r.id===rid).walls.find(w=>w.id===wid)[f]=v; calcRoom(rid);
}
function setWallEx(rid,wid,key,field,val){
  rooms.find(r=>r.id===rid).walls.find(w=>w.id===wid).extras[key][field]=val;
  if(field==='on') reRoom(rid); else calcRoom(rid);
}
function addWall(rid){
  rooms.find(r=>r.id===rid).walls.push(mkWall()); reRoom(rid);
}
function delWall(rid,wid){
  const r=rooms.find(r=>r.id===rid);
  if(r.walls.length===1) r.walls=[mkWall()]; else r.walls=r.walls.filter(w=>w.id!==wid);
  reRoom(rid);
}

/* ── Trims ── */
function setTrimOn(rid,v){ rooms.find(r=>r.id===rid).trim.on=v; reRoom(rid); }
function setTrim(rid,f,v){
  rooms.find(r=>r.id===rid).trim[f]=v; calcRoom(rid);
}
function setTrimEx(rid,key,field,val){
  rooms.find(r=>r.id===rid).trim.extras[key][field]=val;
  if(field==='on') reRoom(rid); else calcRoom(rid);
}

/* ── Shower ── */
function setShowerOn(rid,v){ rooms.find(r=>r.id===rid).shower.on=v; reRoom(rid); }
function setShower(rid,f,v){
  rooms.find(r=>r.id===rid).shower[f]=v; calcRoom(rid);
}
function setShowerEx(rid,key,field,val){
  rooms.find(r=>r.id===rid).shower.extras[key][field]=val;
  if(field==='on') reRoom(rid); else calcRoom(rid);
}

/* ═══════════════════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════════════════ */
function copyKP() {
  const addr=document.getElementById('mAddr').value.trim();
  const cli=document.getElementById('mClient').value.trim();
  const date=document.getElementById('mDate').value.trim();
  const num=document.getElementById('mNum').value.trim();
  let lines=['КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ'];
  if(num) lines.push('№ '+num);
  if(date) lines.push('Дата: '+date);
  if(addr) lines.push('Адрес: '+addr);
  if(cli) lines.push('Заказчик: '+cli);
  lines.push('');
  lines.push('№\tНаименование\tКол-во\tЕд.\tЦена без НДС\tСумма без НДС');
  let grand=0;
  rooms.forEach(room=>{
    const pos=getPositions(room);
    if(!pos.length) return;
    lines.push('');
    lines.push('─── '+(room.name||'Помещение').toUpperCase()+' ───');
    let n=0;
    pos.forEach(p=>{
      if(!p.sub) n++;
      const s=p.qty*p.price; grand+=s;
      lines.push([p.sub?'':n,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(s)].join('\t'));
    });
    const t=pos.reduce((s,p)=>s+p.qty*p.price,0);
    lines.push('\t\t\t\tИтого по разделу:\t'+fmtN(t));
  });
  lines.push('');
  lines.push('══════════════════════════════════════');
  lines.push('\t\t\t\tИТОГО БЕЗ НДС:\t'+fmtN(grand));
  lines.push('НДС не облагается.');
  navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('Скопировано!'));
}

function copyTSV() {
  let rows=[['Помещение','№','Наименование','Кол-во','Ед.','Цена','Сумма']];
  rooms.forEach(room=>{
    let n=0;
    getPositions(room).forEach(p=>{
      if(!p.sub)n++;
      rows.push([room.name,p.sub?'':n,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(p.qty*p.price)]);
    });
    const t=getPositions(room).reduce((s,p)=>s+p.qty*p.price,0);
    rows.push([room.name,'','ИТОГО:','','','',fmtN(t)]);
  });
  rows.push(['','','ИТОГО БЕЗ НДС:','','','',fmtN(grandTotal())]);
  navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n'))
    .then(()=>toast('TSV скопирован — вставьте в Excel'));
}

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function fmtQ(n){ return (Math.round(n*1000)/1000).toString().replace('.',','); }
function fmtN(n){ return (Math.round(n*100)/100).toString().replace('.',','); }

/* ═══════════════════════════════════════════════════════════════
   INIT — пустой старт
═══════════════════════════════════════════════════════════════ */
(function(){
  const d=new Date();
  document.getElementById('mDate').value=
    d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
  // Пустой — без помещений
  render();
})();
</script>
