<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КП — Плитка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:13px/1.4 sans-serif;padding:6px;background:#f0f2f5;padding-bottom:72px}
input,select,button{font:inherit}
.meta{display:flex;flex-wrap:wrap;gap:6px;background:#fff;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:8px}
.meta input{border:1px solid #ccc;padding:5px 7px;border-radius:3px;width:180px;font-size:14px}
.meta label{font-size:11px;color:#666;display:block;margin-bottom:2px}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.btn{padding:7px 13px;cursor:pointer;font-size:13px;border:1px solid #aaa;background:#fff;border-radius:4px;white-space:nowrap;-webkit-appearance:none}
.btn-add{background:#e8f5e9;border-color:#81c784}
.btn-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:17px;padding:0 4px;line-height:1}
.btn-del:active{color:#e53935}
.bp{background:#1565c0;color:#fff;border-color:#1565c0}
.room-block{border:2px solid #1565c0;border-radius:4px;margin-bottom:14px;background:#fff;overflow:hidden}
.room-head{display:flex;align-items:center;gap:8px;background:#1565c0;color:#fff;padding:6px 10px}
.room-head input{background:transparent;color:#fff;border:none;font:700 14px sans-serif;flex:1;min-width:0}
.room-head input::placeholder{color:rgba(255,255,255,.5)}
.rtotal{font:700 14px monospace;white-space:nowrap}
.rdel{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;cursor:pointer;padding:3px 8px;font-size:12px}
/* Таблица */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:400px}
th,td{border:1px solid #ddd;padding:3px 5px;vertical-align:middle}
th{background:#e8e8e8;font-size:11px;text-align:center;white-space:nowrap}
/* Колонка наименования — перенос текста */
th.cn,td.cn{min-width:130px;white-space:normal;word-break:break-word}
td.cn input{width:100%;border:none;background:transparent;font-size:14px}
td.cn input:focus{background:#fffde7;outline:1px solid #fbc02d;border-radius:2px}
td input[type=number]{width:64px;border:none;background:transparent;text-align:right;font-size:14px}
td input[type=number]:focus{background:#fffde7;outline:1px solid #fbc02d;border-radius:2px}
td select{border:none;background:transparent;font-size:12px}
/* Заголовок секции */
.sh{cursor:pointer;user-select:none;-webkit-user-select:none}
.sh td{padding:5px 8px;font-weight:700;font-size:12px;color:#fff;white-space:nowrap}
.sh:active{filter:brightness(.85)}
.sh input[type=checkbox]{margin-right:5px;vertical-align:middle;cursor:pointer}
/* Подстроки (рез 45, резка) */
.sub td{background:#f8f8f8;font-size:12px;color:#666}
.sub td input[type=number]{width:55px;font-size:12px}
/* Суммы */
td.sum{text-align:right;font-weight:700;color:#1565c0;white-space:nowrap;min-width:68px}
.srow td{background:#fff9c4;font-weight:700;padding:5px 8px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #1565c0;padding:6px 10px;display:flex;align-items:center;gap:12px;z-index:99}
.gtotal{font:700 20px monospace;color:#1565c0}
</style>
</head>
<body>

<div class="meta">
  <div><label>Адрес</label><input id="mAddr" placeholder="г. Санкт-Петербург…"></div>
  <div><label>Заказчик</label><input id="mClient" placeholder="ФИО / организация"></div>
  <div><label>Дата</label><input id="mDate"></div>
</div>
<div class="bar">
  <button class="btn bp" onclick="addRoom()">＋ Помещение</button>
  <button class="btn bp" onclick="copyKP()">📋 КП текст</button>
  <button class="btn bp" onclick="copyTSV()">📊 Excel</button>
  <button class="btn" onclick="exportJSON()">💾 JSON</button>
  <button class="btn" onclick="importJSON()">📥 Импорт</button>
</div>

<div id="wrap"></div>
<div class="footer">
  <span style="font-size:12px;color:#666">ИТОГО без НДС:</span>
  <span class="gtotal" id="gt">0 ₽</span>
</div>
<input type="file" id="fi" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
'use strict';
var _uid=0;
function uid(){return 'u'+(++_uid);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function fmtN(n){return (Math.round(n*100)/100).toString().replace('.',',');}
var KEY='kp-v5', META=['mAddr','mClient','mDate'];
var UNITS=['м²','пог.м','шт','м','объём'];

function mi(name,qty,unit,price,on){return {id:uid(),name:name,qty:qty,unit:unit,price:price,on:on||false,note:''};}
function mw(){return {id:uid(),label:'',tile:'',area:0,price:8000,c4on:false,c4l:0,c4p:1200,con:false,cl:0,cp:1000};}

function makeRoom(name){
  return {
    id:uid(), name:name||'',
    demo:{on:true,cl:false,items:[
      mi('Демонтаж плитки с пола',0,'м²',170),
      mi('Демонтаж плитки со стен',0,'м²',170),
      mi('Демонтаж потолка',0,'м²',170),
      mi('Демонтаж сантехники',1,'шт',500)
    ]},
    prep:{on:false,cl:true,items:[
      mi('Грунтовка пола (2 слоя)',0,'м²',80),
      mi('Грунтовка стен (2 слоя)',0,'м²',80),
      mi('Подготовка стен',0,'м²',170),
      mi('Выравнивание стен',0,'м²',350)
    ]},
    hydro:{cl:true,fon:false,fa:0,fp:300,won:false,wa:0,wp:200},
    floor:{on:true,cl:false,area:0,price:6500,tile:'',c4on:false,c4l:0,c4p:1200,con:false,cl2:0,cp:1000},
    wOn:true, wCl:false, walls:[mw()],
    trims:{on:false,cl:true,len:0,price:1200,tile:'',c4on:false,c4l:0,c4p:1200,con:false,cl2:0,cp:1000},
    shower:{on:false,cl:true,tq:1,tp:2500,c4:0,c4p:1200,cut:0,cutp:1000,hydro:0,hp:300},
    grout:{on:true,price:1300},
    holes:{on:false,qty:0,price:1700},
    hatches:{on:false,cl:true,items:[mi('Люк (стандартный)',1,'шт',0)]},
    gkl:{on:false,cl:true,items:[
      mi('Металлоконструкция (каркас)',0,'м²',0),
      mi('Обшивка ГКЛ',0,'м²',0),
      mi('Обшивка ГВЛ',0,'м²',0),
      mi('Формирование угла',0,'пог.м',0)
    ]},
    sanitary:{on:false,cl:true,items:[
      mi('Установка унитаза',1,'шт',1200),
      mi('Установка ванны / поддона',1,'шт',1800),
      mi('Установка смесителя',1,'шт',600),
      mi('Установка раковины',1,'шт',1300),
      mi('Монтаж полотенцесушителя',1,'шт',1500),
      mi('Монтаж вентилятора',1,'шт',450)
    ]},
    electric:{on:false,cl:true,items:[]},
    trash:{on:false,cl:true,large:{on:false,qty:0,price:0},regular:{on:false,qty:0,price:0}},
    custom:{cl:false,items:[]}
  };
}

var rooms=[];

function getPos(r){
  var P=[];
  function p(n,q,u,pr){P.push({name:n,qty:+q||0,unit:u,price:+pr||0});}
  if(r.demo.on)(r.demo.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.prep.on)(r.prep.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.hydro.fon&&+r.hydro.fa>0)p('Гидроизоляция пола',r.hydro.fa,'м²',r.hydro.fp);
  if(r.hydro.won&&+r.hydro.wa>0)p('Гидроизоляция стен',r.hydro.wa,'м²',r.hydro.wp);
  if(r.floor.on&&+r.floor.area>0){
    p(r.floor.tile?'Укладка '+r.floor.tile+' (пол)':'Укладка плитки на пол',r.floor.area,'м²',r.floor.price);
    if(r.floor.c4on&&+r.floor.c4l>0)p('Рез 45° (пол)',r.floor.c4l,'м',r.floor.c4p);
    if(r.floor.con&&+r.floor.cl2>0)p('Резка плитки (пол)',r.floor.cl2,'м',r.floor.cp);
  }
  if(r.wOn)r.walls.forEach(function(w){
    if(!+w.area)return;
    p((w.tile?'Укладка '+w.tile:'Укладка плитки')+(w.label?' — '+w.label:' (стены)'),w.area,'м²',w.price);
    if(w.c4on&&+w.c4l>0)p('Рез 45° стены'+(w.label?' ('+w.label+')':''),w.c4l,'м',w.c4p);
    if(w.con&&+w.cl>0)p('Резка плитки стены'+(w.label?' ('+w.label+')':''),w.cl,'м',w.cp);
  });
  if(r.trims.on&&+r.trims.len>0){
    p(r.trims.tile?'Откосы ('+r.trims.tile+')':'Откосы дверные',r.trims.len,'пог.м',r.trims.price);
    if(r.trims.c4on&&+r.trims.c4l>0)p('Рез 45° (откосы)',r.trims.c4l,'м',r.trims.c4p);
    if(r.trims.con&&+r.trims.cl2>0)p('Резка плитки (откосы)',r.trims.cl2,'м',r.trims.cp);
  }
  if(r.shower.on){
    if(+r.shower.tq>0)p('Установка трапа',r.shower.tq,'шт',r.shower.tp);
    if(+r.shower.c4>0)p('Рез 45° (поддон)',r.shower.c4,'м',r.shower.c4p);
    if(+r.shower.cut>0)p('Резка плитки (поддон)',r.shower.cut,'м',r.shower.cutp);
    if(+r.shower.hydro>0)p('Гидроизоляция поддона',r.shower.hydro,'м²',r.shower.hp);
  }
  var ga=0;
  if(r.floor.on)ga+=+r.floor.area||0;
  if(r.wOn)r.walls.forEach(function(w){ga+=+w.area||0;});
  ga=Math.round(ga*100)/100;
  if(r.grout.on&&ga>0)p('Затирка плитки',ga,'м²',r.grout.price);
  if(r.holes.on&&+r.holes.qty>0)p('Выпиливание отверстий',r.holes.qty,'шт',r.holes.price);
  if(r.hatches.on)(r.hatches.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.gkl.on)(r.gkl.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.sanitary.on)(r.sanitary.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name+(i.note?' ('+i.note+')':''),i.qty,i.unit,i.price);});
  if(r.electric.on)(r.electric.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.trash.on){
    if(r.trash.large.on&&+r.trash.large.qty>0)p('Вывоз крупногабаритного мусора',r.trash.large.qty,'м³',r.trash.large.price);
    if(r.trash.regular.on&&+r.trash.regular.qty>0)p('Вывоз строительного мусора',r.trash.regular.qty,'м³',r.trash.regular.price);
  }
  (r.custom.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  return P;
}

function rTotal(r){return getPos(r).reduce(function(s,p){return s+p.qty*p.price;},0);}
function gTotal(){return rooms.reduce(function(s,r){return s+rTotal(r);},0);}

var saveT=null;
function sched(){clearTimeout(saveT);saveT=setTimeout(save,500);}
function save(){
  var m={};META.forEach(function(k){m[k]=document.getElementById(k).value||'';});
  try{localStorage.setItem(KEY,JSON.stringify({v:1,m:m,rooms:rooms,uid:_uid}));}catch(e){}
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d||!d.rooms)return false;
    if(d.uid)_uid=d.uid;
    rooms=d.rooms.map(mg);
    if(d.m)META.forEach(function(k){var el=document.getElementById(k);if(el&&d.m[k]!=null)el.value=d.m[k];});
    return true;
  }catch(e){return false;}
}
function mg(r){
  if(!r)return makeRoom();
  var t=makeRoom();
  Object.keys(t).forEach(function(k){if(r[k]==null)r[k]=t[k];});
  ['demo','prep','hatches','gkl','sanitary','electric','custom'].forEach(function(k){
    if(!r[k])r[k]=t[k];
    else{if(r[k].cl==null)r[k].cl=true;if(!Array.isArray(r[k].items))r[k].items=t[k].items;}
  });
  if(!r.hydro)r.hydro=t.hydro;
  else{
    if(r.hydro.fon==null)r.hydro.fon=r.hydro.on||false;
    if(r.hydro.won==null)r.hydro.won=false;
    ['cl','fa','fp','wa','wp'].forEach(function(k){if(r.hydro[k]==null)r.hydro[k]=t.hydro[k];});
  }
  if(!Array.isArray(r.walls)||!r.walls.length)r.walls=[mw()];
  ['floor','trims','shower','grout','holes','trash'].forEach(function(k){
    if(!r[k])r[k]=t[k];
    else Object.keys(t[k]).forEach(function(kk){if(r[k][kk]==null)r[k][kk]=t[k][kk];});
  });
  if(!r.custom)r.custom=t.custom;
  return r;
}

function render(){
  var w=document.getElementById('wrap');w.innerHTML='';
  rooms.forEach(function(r){
    try{w.appendChild(buildRoom(r));}catch(e){console.error('buildRoom error',e);}
  });
  document.getElementById('gt').textContent=fmt(gTotal())+' ₽';
  sched();
}
function rr(rid){
  var r=rooms.filter(function(x){return x.id===rid;})[0];
  var old=document.getElementById('room_'+rid);
  if(r&&old){try{old.parentNode.replaceChild(buildRoom(r),old);}catch(e){console.error(e);}}
  document.getElementById('gt').textContent=fmt(gTotal())+' ₽';
  sched();
}

function usel(val,cb){
  return '<select onchange="'+cb+'">'+UNITS.map(function(u){return '<option'+(u===val?' selected':'')+'>'+u+'</option>';}).join('')+'</select>';
}
function sv(on,a,b){return on&&+a&&+b?fmt((+a)*(+b)):'';  }

// Заголовок секции
function shRow(label,bg,swHtml,open,onclk){
  return '<tr class="sh" style="background:'+bg+'" onclick="'+onclk+'">'
    +'<td colspan="7" style="padding:5px 8px">'+swHtml+' '+(open?'▼':'▶')+' '+label+'</td></tr>';
}
function swCb(rid,key,checked){
  return '<input type="checkbox"'+(checked?' checked':'')+' onclick="event.stopPropagation()" onchange="secOn(\''+rid+'\',\''+key+'\',this.checked)" style="vertical-align:middle">';
}

// Строки позиций
function irows(rid,sec,items){
  return items.map(function(it){
    var s=it.on&&+it.qty&&+it.price?fmt((+it.qty)*(+it.price)):'';
    return '<tr>'
      +'<td style="text-align:center;width:24px"><input type="checkbox"'+(it.on?' checked':'')+' onchange="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'on\',this.checked)"></td>'
      +'<td class="cn"><input value="'+esc(it.name)+'" placeholder="Наименование" oninput="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'name\',this.value)"></td>'
      +'<td><input type="number" min="0" step="0.01" value="'+(it.qty||'')+'" placeholder="0" oninput="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'qty\',+this.value||0)"></td>'
      +'<td>'+usel(it.unit,'SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'unit\',this.value)')+'</td>'
      +'<td><input type="number" min="0" step="100" value="'+(it.price||'')+'" placeholder="0" oninput="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'price\',+this.value||0)"></td>'
      +'<td class="sum">'+s+'</td>'
      +'<td style="text-align:center;width:26px"><button class="btn-del" onclick="delI(\''+rid+'\',\''+sec+'\',\''+it.id+'\')">✕</button></td></tr>';
  }).join('');
}

// Подстроки рез 45° и резка (пол / откосы)
function cutF(rid,obj){
  return '<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(obj.c4on?' checked':'')+' onchange="setFloor(\''+rid+'\',\'c4on\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Рез 45°</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(obj.c4l||'')+'" placeholder="0" oninput="setFloor(\''+rid+'\',\'c4l\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(obj.c4p||'')+'" oninput="setFloor(\''+rid+'\',\'c4p\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(obj.c4on,obj.c4l,obj.c4p)+'</td><td></td></tr>'
    +'<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(obj.con?' checked':'')+' onchange="setFloor(\''+rid+'\',\'con\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Резка плитки</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(obj.cl2||'')+'" placeholder="0" oninput="setFloor(\''+rid+'\',\'cl2\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(obj.cp||'')+'" oninput="setFloor(\''+rid+'\',\'cp\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(obj.con,obj.cl2,obj.cp)+'</td><td></td></tr>';
}
function cutT(rid,obj){
  return '<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(obj.c4on?' checked':'')+' onchange="setTrim(\''+rid+'\',\'c4on\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Рез 45°</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(obj.c4l||'')+'" placeholder="0" oninput="setTrim(\''+rid+'\',\'c4l\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(obj.c4p||'')+'" oninput="setTrim(\''+rid+'\',\'c4p\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(obj.c4on,obj.c4l,obj.c4p)+'</td><td></td></tr>'
    +'<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(obj.con?' checked':'')+' onchange="setTrim(\''+rid+'\',\'con\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Резка плитки</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(obj.cl2||'')+'" placeholder="0" oninput="setTrim(\''+rid+'\',\'cl2\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(obj.cp||'')+'" oninput="setTrim(\''+rid+'\',\'cp\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(obj.con,obj.cl2,obj.cp)+'</td><td></td></tr>';
}
// Подстроки рез/резка стены
function cutW(rid,wid,w){
  return '<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(w.c4on?' checked':'')+' onchange="setW(\''+rid+'\',\''+wid+'\',\'c4on\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Рез 45°</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(w.c4l||'')+'" placeholder="0" oninput="setW(\''+rid+'\',\''+wid+'\',\'c4l\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(w.c4p||'')+'" oninput="setW(\''+rid+'\',\''+wid+'\',\'c4p\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(w.c4on,w.c4l,w.c4p)+'</td><td></td></tr>'
    +'<tr class="sub">'
    +'<td style="text-align:center"><input type="checkbox"'+(w.con?' checked':'')+' onchange="setW(\''+rid+'\',\''+wid+'\',\'con\',this.checked)"></td>'
    +'<td class="cn" style="padding-left:14px;color:#777">Резка плитки</td>'
    +'<td><input type="number" min="0" step="0.1" value="'+(w.cl||'')+'" placeholder="0" oninput="setW(\''+rid+'\',\''+wid+'\',\'cl\',+this.value||0)"></td>'
    +'<td>м</td><td><input type="number" min="0" step="100" value="'+(w.cp||'')+'" oninput="setW(\''+rid+'\',\''+wid+'\',\'cp\',+this.value||0)"></td>'
    +'<td class="sum">'+sv(w.con,w.cl,w.cp)+'</td><td></td></tr>';

// ── Setters ──
function setName(id,v){var r=rooms.filter(function(x){return x.id===id;})[0];r.name=v;var el=document.querySelector('#room_'+id+' .rtotal');if(el)el.textContent=fmt(rTotal(r))+' ₽';sched();}

function secOn(id,key,v){
  var r=rooms.filter(function(x){return x.id===id;})[0];
  if(key==='floor')r.floor.on=v;
  else if(key==='walls')r.wOn=v;
  else if(key==='trims')r.trims.on=v;
  else if(r[key]&&'on' in r[key])r[key].on=v;
  rr(id);
}
function toggleCl(id,key){
  var r=rooms.filter(function(x){return x.id===id;})[0];
  if(key==='floor')r.floor.cl=!r.floor.cl;
  else if(key==='trims')r.trims.cl=!r.trims.cl;
  else if(key==='hydro')r.hydro.cl=!r.hydro.cl;
  else r[key].cl=!r[key].cl;
  rr(id);
}
function toggleW(id){var r=rooms.filter(function(x){return x.id===id;})[0];r.wCl=!r.wCl;rr(id);}
function setFloor(id,f,v){rooms.filter(function(x){return x.id===id;})[0].floor[f]=v;rr(id);}
function setTrim(id,f,v){rooms.filter(function(x){return x.id===id;})[0].trims[f]=v;rr(id);}
function setH(id,f,v){rooms.filter(function(x){return x.id===id;})[0].hydro[f]=v;rr(id);}
function setSh(id,f,v){rooms.filter(function(x){return x.id===id;})[0].shower[f]=v;rr(id);}
function setGH(id,key,f,v){rooms.filter(function(x){return x.id===id;})[0][key][f]=v;rr(id);}
function setTr(id,sub,f,v){rooms.filter(function(x){return x.id===id;})[0].trash[sub][f]=v;rr(id);}
function setW(rid,wid,f,v){var w=rooms.filter(function(x){return x.id===rid;})[0].walls.filter(function(w){return w.id===wid;})[0];if(w){w[f]=v;rr(rid);}}
function addW(rid){rooms.filter(function(x){return x.id===rid;})[0].walls.push(mw());rr(rid);}
function delW(rid,wid){var r=rooms.filter(function(x){return x.id===rid;})[0];r.walls=r.walls.length>1?r.walls.filter(function(w){return w.id!==wid;}):[mw()];rr(rid);}
function SF(rid,key,iid,f,v){var item=rooms.filter(function(x){return x.id===rid;})[0][key].items.filter(function(i){return i.id===iid;})[0];if(item){item[f]=v;rr(rid);}}
function addI(rid,key){rooms.filter(function(x){return x.id===rid;})[0][key].items.push(mi('',1,'шт',0,true));rr(rid);}
function delI(rid,key,iid){var r=rooms.filter(function(x){return x.id===rid;})[0];r[key].items=r[key].items.filter(function(i){return i.id!==iid;});rr(rid);}
function addRoom(){var r=makeRoom();rooms.push(r);render();}
function delRoom(id){if(!confirm('Удалить помещение?'))return;rooms=rooms.filter(function(r){return r.id!==id;});render();}

// ── Экспорт ──
function copyKP(){
  var a=document.getElementById('mAddr').value,c=document.getElementById('mClient').value,d=document.getElementById('mDate').value;
  var L=['КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ'];
  if(d)L.push('Дата: '+d);if(a)L.push('Адрес: '+a);if(c)L.push('Заказчик: '+c);
  L.push('','№\tНаименование\tКол-во\tЕд.\tЦена\tСумма');
  var grand=0;
  rooms.forEach(function(r){
    var P=getPos(r);if(!P.length)return;
    L.push('','─── '+(r.name||'Помещение').toUpperCase()+' ───');
    var st=0;
    P.forEach(function(p,i){var s=p.qty*p.price;st+=s;grand+=s;L.push([i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(s)].join('\t'));});
    L.push('\t\t\t\tИтого:\t'+fmtN(st));
  });
  L.push('','ИТОГО БЕЗ НДС:\t'+fmtN(grand),'НДС не облагается.');
  var t=L.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){alert('КП скопировано!');}).catch(function(){fbCopy(t);});
  }else{fbCopy(t);}
}
function fbCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('КП скопировано!');}catch(e){alert('Ошибка копирования');}document.body.removeChild(ta);}
function copyTSV(){
  var rows=[['Помещение','№','Наименование','Кол-во','Ед.','Цена','Сумма']];
  rooms.forEach(function(r){var P=getPos(r);P.forEach(function(p,i){rows.push([r.name,i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(p.qty*p.price)]);});if(P.length)rows.push([r.name,'','Итого:','','','',fmtN(P.reduce(function(s,p){return s+p.qty*p.price;},0))]);});
  rows.push(['','','ИТОГО:','','','',fmtN(gTotal())]);
  var t=rows.map(function(r){return r.join('\t');}).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('Excel TSV скопирован!');}).catch(function(){fbCopy(t);});}else{fbCopy(t);}
}
function exportJSON(){
  var m={};META.forEach(function(k){m[k]=document.getElementById(k).value||'';});
  var b=new Blob([JSON.stringify({v:1,m:m,rooms:rooms,uid:_uid},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kp-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function importJSON(){document.getElementById('fi').click();}
function handleImport(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.rooms||!Array.isArray(d.rooms))throw new Error('Неверный формат');
      if(rooms.length>0&&!confirm('Заменить данные?'))return;
      if(d.uid)_uid=d.uid;
      rooms=d.rooms.map(mg);
      if(d.m)META.forEach(function(k){var el=document.getElementById(k);if(el&&d.m[k]!=null)el.value=d.m[k];});
      render();
    }catch(err){alert('Ошибка: '+err.message);}
  };
  rd.readAsText(f);e.target.value='';
}

META.forEach(function(k){var el=document.getElementById(k);if(el)el.addEventListener('input',sched);});
if(!load()){
  document.getElementById('mDate').value=new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
