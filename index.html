<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КП — Плиточные работы</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
–bg:      #f0f2f5;
–card:    #ffffff;
–border:  #e2e6ed;
–border2: #c8cdd8;
–accent:  #1c3f7a;
–accent-l:#2456aa;
–amber:   #d97706;
–red:     #dc2626;
–text:    #111827;
–text2:   #6b7280;
–text3:   #9ca3af;
–shadow:  0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
–r:8px; –r2:6px;
–h:44px; /* минимальная высота тапа */
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(–bg);color:var(–text);font-family:‘Inter’,sans-serif;font-size:14px;min-height:100vh;padding-bottom:60px;}

/* ── TOP ── */
.top{background:var(–accent);padding:13px 16px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.top-title{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.55);}
.top-sum{font-family:‘JetBrains Mono’,monospace;font-size:20px;font-weight:700;color:#fff;}

/* ── META ── */
.meta{margin:10px 10px 0;background:var(–card);border-radius:var(–r);box-shadow:var(–shadow);overflow:hidden;border-left:3px solid var(–amber);}
.meta-row{display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(–border);min-height:var(–h);}
.meta-row:last-child{border-bottom:none;}
.meta-lbl{font-size:11px;font-weight:600;color:var(–text3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;min-width:72px;}
.meta-inp{flex:1;border:none;outline:none;font-family:‘Inter’,sans-serif;font-size:14px;color:var(–text);background:transparent;height:var(–h);}
.meta-inp::placeholder{color:var(–text3);}
.meta-inp:focus{background:#fffbeb;border-radius:3px;}

/* ── ROOM ── */
.room{margin:10px 10px 0;background:var(–card);border-radius:var(–r);box-shadow:var(–shadow);overflow:hidden;}
.room-head{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(–accent);cursor:pointer;min-height:52px;}
.room-name-inp{flex:1;border:none;outline:none;background:transparent;font-family:‘Inter’,sans-serif;font-size:15px;font-weight:600;color:#fff;height:52px;}
.room-name-inp::placeholder{color:rgba(255,255,255,.4);}
.room-name-inp:focus{background:rgba(255,255,255,.18);border-radius:5px;padding:0 8px;color:#fff;}
.room-head-total{font-family:‘JetBrains Mono’,monospace;font-size:14px;color:rgba(255,255,255,.9);white-space:nowrap;}
.room-del-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:22px;padding:0 4px;line-height:1;min-width:36px;text-align:center;}
.room-del-btn:active{color:#fca5a5;}
.room-chevron{color:rgba(255,255,255,.5);font-size:13px;transition:transform .2s;}
.room.collapsed .room-chevron{transform:rotate(-90deg);}
.room.collapsed .room-body{display:none;}
.room-body{border-top:1px solid var(–border);}

/* ── SECTION ── */
.sec-block{border-bottom:1px solid var(–border);}
.sec-block:last-child{border-bottom:none;}
.sec-toggle-row{display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;user-select:none;min-height:var(–h);}
.sec-icon{font-size:18px;flex-shrink:0;}
.sec-label{flex:1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(–text2);}
.sec-badge{font-size:11px;color:var(–text3);font-family:‘JetBrains Mono’,monospace;}

/* ── TOGGLE SWITCH (крупный) ── */
.sw{position:relative;width:44px;height:26px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw-track{position:absolute;inset:0;background:var(–border2);border-radius:13px;transition:background .2s;cursor:pointer;}
.sw input:checked+.sw-track{background:var(–accent-l);}
.sw-track::after{content:’’;position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.sw input:checked+.sw-track::after{transform:translateX(18px);}

.sec-content{padding:0 12px 12px;display:none;}
.sec-content.open{display:block;}

/* ── SURFACE CARDS ── */
.surface-card{background:#f8f9fb;border:1px solid var(–border);border-radius:var(–r2);margin-bottom:10px;overflow:hidden;}
.surface-card.wall-card{border-left:3px solid var(–accent-l);}
.surface-card.floor-card{border-left:3px solid var(–amber);}
.surface-card.trim-card{border-left:3px solid #7c3aed;}

/* поле внутри карточки: текстовые */
.surface-row{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(–border);min-height:var(–h);}
.surface-row:last-child{border-bottom:none;}
.s-lbl{font-size:11px;font-weight:600;color:var(–text3);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;min-width:48px;}
.s-inp{flex:1;border:none;outline:none;font-family:‘Inter’,sans-serif;font-size:14px;color:var(–text);background:transparent;height:var(–h);}
.s-inp::placeholder{color:var(–text3);}
.s-inp:focus{background:#fffbeb;border-radius:3px;}

/* числовые поля */
.s-num{border:none;outline:none;font-family:‘JetBrains Mono’,monospace;font-size:15px;font-weight:600;color:var(–text);background:transparent;width:70px;text-align:right;height:var(–h);}
.s-num:focus{background:#fffbeb;border-radius:3px;}
.s-unit{font-size:12px;color:var(–text2);white-space:nowrap;}
.s-price-inp{border:none;outline:none;font-family:‘JetBrains Mono’,monospace;font-size:13px;color:var(–accent);background:transparent;width:66px;text-align:right;height:var(–h);}
.s-price-inp:focus{background:#fffbeb;border-radius:3px;}

.surface-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(36,86,170,.06);border-bottom:1px solid var(–border);}
.surface-head-lbl{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(–accent-l);}
.surf-del{background:none;border:none;cursor:pointer;color:var(–text3);font-size:20px;padding:4px;min-width:36px;text-align:center;}
.surf-del:active{color:var(–red);}

.add-surf-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1.5px dashed var(–border2);border-radius:var(–r2);color:var(–text2);font-family:‘Inter’,sans-serif;font-size:13px;font-weight:500;padding:13px 12px;cursor:pointer;width:100%;transition:all .2s;}
.add-surf-btn:active{border-color:var(–accent-l);color:var(–accent-l);}

/* ── ITEM ROW (2-строчный на мобиле) ── */
.item-card{border-bottom:1px solid var(–border);background:var(–card);}
.item-card:nth-child(even){background:#fafbfc;}
.item-card:last-child{border-bottom:none;}
.item-card-top{display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;min-height:var(–h);}
.item-name-inp{flex:1;border:none;outline:none;font-family:‘Inter’,sans-serif;font-size:14px;color:var(–text);background:transparent;height:var(–h);}
.item-name-inp::placeholder{color:var(–text3);}
.item-name-inp:focus{background:#fffbeb;border-radius:3px;}
.item-card-bot{display:flex;align-items:center;gap:6px;padding:0 10px 10px 54px;}
.i-num{border:1px solid var(–border);outline:none;border-radius:var(–r2);font-family:‘JetBrains Mono’,monospace;font-size:14px;font-weight:600;color:var(–text);background:#fff;text-align:center;width:72px;height:36px;padding:0 6px;}
.i-num:focus{border-color:var(–accent-l);background:#fffbeb;}
.unit-sel{border:1px solid var(–border);outline:none;border-radius:var(–r2);font-family:‘Inter’,sans-serif;font-size:12px;color:var(–text2);background:#fff;height:36px;padding:0 4px;cursor:pointer;min-width:52px;}
.i-price{border:1px solid var(–border);outline:none;border-radius:var(–r2);font-family:‘JetBrains Mono’,monospace;font-size:13px;color:var(–accent);background:#fff;text-align:center;width:74px;height:36px;padding:0 6px;}
.i-price:focus{border-color:var(–accent-l);background:#fffbeb;}
.i-unit-lbl{font-size:11px;color:var(–text3);}
.i-del{background:none;border:none;cursor:pointer;color:var(–text3);font-size:20px;padding:4px;min-width:34px;text-align:center;flex-shrink:0;}
.i-del:active{color:var(–red);}
.item-note-row{padding:4px 10px 10px 54px;border-top:1px dashed var(–border);}
.item-note-inp{border:none;outline:none;font-family:‘Inter’,sans-serif;font-size:12px;color:var(–text2);background:transparent;width:100%;font-style:italic;height:32px;}
.item-note-inp::placeholder{color:var(–text3);}
.item-note-inp:focus{background:#fffbeb;border-radius:3px;}

.add-item-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(–accent-l);font-family:‘Inter’,sans-serif;font-size:13px;font-weight:500;padding:12px 14px;cursor:pointer;width:100%;border-top:1px dashed var(–border);min-height:44px;}
.add-item-btn:active{background:#f0f4fa;}

/* ── EXTRA ROW (затирка, отверстия, душ) ── */
.extra-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 0;border-bottom:1px solid var(–border);}
.extra-row:last-child{border-bottom:none;}
.extra-name{font-size:13px;color:var(–text);flex:1;min-width:80px;}
.extra-qty{border:1px solid var(–border);outline:none;border-radius:var(–r2);font-family:‘JetBrains Mono’,monospace;font-size:14px;font-weight:600;color:var(–text);background:#fff;text-align:center;width:70px;height:36px;padding:0 6px;}
.extra-qty:focus{border-color:var(–accent-l);background:#fffbeb;}
.extra-unit{font-size:11px;color:var(–text2);white-space:nowrap;}
.extra-price{border:1px solid var(–border);outline:none;border-radius:var(–r2);font-family:‘JetBrains Mono’,monospace;font-size:13px;color:var(–accent);background:#fff;text-align:center;width:72px;height:36px;padding:0 6px;}
.extra-price:focus{border-color:var(–accent-l);background:#fffbeb;}

/* ── HYDRO ROW ── */
.hydro-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 0;border-bottom:1px solid var(–border);}
.hydro-row:last-child{border-bottom:none;}
.hydro-label{flex:1;font-size:13px;color:var(–text);min-width:80px;}

/* ── ИТОГОВЫЕ ПОЗИЦИИ ── */
.pos-section{background:#f0f4fa;border-top:2px solid var(–border);}
.pos-section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(–border);}
.pos-section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(–text2);}
.pos-section-total{font-family:‘JetBrains Mono’,monospace;font-size:16px;font-weight:700;color:var(–accent);}
.pos-row{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(–border);gap:6px;}
.pos-row:last-child{border-bottom:none;}
.pos-row:nth-child(odd){background:rgba(255,255,255,.7);}
.pos-n{color:var(–text3);font-size:11px;width:18px;flex-shrink:0;text-align:center;}
.pos-name{flex:1;color:var(–text);line-height:1.35;font-size:12px;}
.pos-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;}
.pos-qty-unit{font-family:‘JetBrains Mono’,monospace;font-size:11px;color:var(–text2);}
.pos-sum{font-family:‘JetBrains Mono’,monospace;font-size:13px;font-weight:700;color:var(–accent);}

/* ── ADD ROOM ── */
.add-room{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px;background:var(–card);border:2px dashed var(–border2);border-radius:var(–r);color:var(–text2);font-family:‘Inter’,sans-serif;font-size:14px;font-weight:500;padding:16px;cursor:pointer;width:calc(100% - 20px);box-shadow:var(–shadow);min-height:52px;}
.add-room:active{border-color:var(–accent-l);color:var(–accent);}

/* ── FOOTER ── */
.footer{margin:10px;background:var(–card);border-radius:var(–r);box-shadow:var(–shadow);overflow:hidden;}
.footer-total-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.footer-total-lbl{font-size:12px;font-weight:600;color:var(–text2);text-transform:uppercase;letter-spacing:.4px;}
.footer-total-amt{font-family:‘JetBrains Mono’,monospace;font-size:26px;font-weight:700;color:var(–accent);}
.footer-hint{padding:0 16px 12px;font-size:12px;color:var(–text3);}
.footer-btns{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(–border);}
.btn{flex:1;padding:14px 8px;border:none;border-radius:var(–r);font-family:‘Inter’,sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;min-height:50px;}
.btn-primary{background:var(–accent);color:#fff;}
.btn-primary:active{background:#132d5a;}
.btn-sec{background:var(–bg);color:var(–text2);border:1px solid var(–border2);}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(–accent);color:#fff;font-size:14px;font-weight:600;padding:12px 28px;border-radius:24px;z-index:999;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>

</head>
<body>

<div class="top">
  <div class="top-title">КП · Плиточные работы</div>
  <div class="top-sum" id="topSum">0 ₽</div>
</div>

<div class="meta">
  <div class="meta-row"><span class="meta-lbl">Адрес</span><input class="meta-inp" id="mAddr" placeholder="г. Санкт-Петербург, …" ></div>
  <div class="meta-row"><span class="meta-lbl">Заказчик</span><input class="meta-inp" id="mClient" placeholder="ФИО / организация"></div>
  <div class="meta-row"><span class="meta-lbl">Дата</span><input class="meta-inp" id="mDate" placeholder="дд.мм.гггг"></div>
</div>

<div id="roomsWrap"></div>
<button class="add-room" onclick="addRoom()">＋ Добавить помещение</button>

<div class="footer">
  <div class="footer-total-row">
    <div class="footer-total-lbl">Итого без НДС</div>
    <div class="footer-total-amt" id="footerAmt">0 ₽</div>
  </div>
  <div class="footer-hint">НДС не облагается.</div>
  <div class="footer-btns">
    <button class="btn btn-primary" onclick="copyKP()">📋 Скопировать КП</button>
    <button class="btn btn-sec" onclick="copyTSV()">↓ Excel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let _uid=0; const uid=()=>'u'+(++_uid);
const DEF={floorLay:6500,wallLay:8000,trimLay:1200,cut45:1200,cutting:1000,grout:1300,holes:1700,trapPrice:2500};
const makeWall=(label='')=>({id:uid(),label,area:0,tile:'',price:DEF.wallLay,cut45:{on:false,length:0,price:1200},cutting:{on:false,length:0,price:1000}});
const makeItem=(name,qty,unit,price,on=false)=>({id:uid(),name,qty,unit,price,on,note:''});
const makeRoom=(name='')=>({id:uid(),name,collapsed:false,floor:{on:true,area:0,tile:'',price:DEF.floorLay,cut45:{on:false,length:0,price:1200},cutting:{on:false,length:0,price:1000}},wallsOn:true,walls:[makeWall()],trims:{on:false,length:0,tile:'',price:DEF.trimLay,cut45:{on:false,length:0,price:1200},cutting:{on:false,length:0,price:1000}},shower:{on:false,trapQty:1,trapPrice:DEF.trapPrice,cut45:0,cut45Price:DEF.cut45,cutting:0,cuttingPrice:DEF.cutting,hydro:0,hydroPrice:300},grout:{on:true,price:DEF.grout},holes:{on:false,qty:0,price:DEF.holes},
    hydro:{floorOn:false,floorArea:0,floorPrice:300,wallsOn:false,wallsArea:0,wallsPrice:200},
    demo:{on:false,items:[makeItem('Демонтаж плитки с пола',0,'м²',170),makeItem('Демонтаж плитки со стен',0,'м²',170),makeItem('Демонтаж потолка',0,'м²',170),makeItem('Демонтаж сантехники',1,'шт',500)]},
    prep:{on:false,items:[makeItem('Грунтовка пола (2 слоя)',0,'м²',80),makeItem('Грунтовка стен (2 слоя)',0,'м²',80),makeItem('Подготовка стен к выравниванию',0,'м²',170),makeItem('Выравнивание стен',0,'м²',350)]},
    sanitary:{on:false,items:[makeItem('Установка унитаза',1,'шт',1200),makeItem('Установка ванны / поддона',1,'шт',1800),makeItem('Установка смесителя',1,'шт',600),makeItem('Установка раковины / мойдодыра',1,'шт',1300),makeItem('Монтаж полотенцесушителя',1,'шт',1500),makeItem('Устройство вент канала',1,'шт',1200),makeItem('Монтаж вентилятора',1,'шт',450),makeItem('Разводка труб х/г воды',0,'пог.м',0),makeItem('Подключения х/г воды',0,'шт',0),makeItem('Разводка канализации',0,'пог.м',0),makeItem('Подключения канализации',0,'шт',0)]},
    electric:{on:false,items:[]},
    // Люки
    hatches:{on:false,items:[makeItem('Люк (стандартный)',1,'шт',0),makeItem('Люк скрытого монтажа',1,'шт',0)]},
    // Металлоконструкции / ГКЛ
    gkl:{on:false,items:[makeItem('Металлоконструкция (каркас)',0,'м²',0),makeItem('Обшивка ГКЛ',0,'м²',0),makeItem('Обшивка ГВЛ',0,'м²',0),makeItem('Формирование угла',0,'пог.м',0)]},
    // Разводка
    pipes:{on:false,
      hvsLen:0,hvsPrice:0,
      gvsLen:0,gvsPrice:0,
      kanLen:0,kanPrice:0,
      hvsPoints:0,hvsPointPrice:0,
      gvsPoints:0,gvsPointPrice:0,
      kanPoints:0,kanPointPrice:0,
      meters:{on:false,qty:1,price:0,note:''},
      filters:{on:false,qty:1,price:0,note:''}
    },
    // Мусор
    trash:{on:false,large:{on:false,qty:0,price:0},regular:{on:false,qty:0,price:0}},
    custom:{items:[]}});

let rooms=[];

function getPositions(room){
  const pos=[];
  // Демонтаж
  if(room.demo.on) room.demo.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name,qty:i.qty,unit:i.unit,price:i.price}));
  // Подготовка
  if(room.prep.on) room.prep.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name,qty:i.qty,unit:i.unit,price:i.price}));
  // Гидроизоляция
  if(room.hydro.floorOn&&room.hydro.floorArea>0) pos.push({name:'Гидроизоляция пола',qty:room.hydro.floorArea,unit:'м²',price:room.hydro.floorPrice});
  if(room.hydro.wallsOn&&room.hydro.wallsArea>0) pos.push({name:'Гидроизоляция стен',qty:room.hydro.wallsArea,unit:'м²',price:room.hydro.wallsPrice});
  if(room.floor.on&&room.floor.area>0) pos.push({name:(room.floor.tile?'Укладка '+room.floor.tile+' на пол':'Укладка плитки на пол'),qty:room.floor.area,unit:'м²',price:room.floor.price});
  if(room.wallsOn) room.walls.forEach(w=>{if(!w.area)return; pos.push({name:(w.tile?'Укладка '+w.tile:'Укладка плитки')+(w.label?' — '+w.label:' на стены'),qty:w.area,unit:'м²',price:w.price});});
  if(room.trims.on&&room.trims.length>0) pos.push({name:(room.trims.tile?'Откосы дверные ('+room.trims.tile+')':'Откосы дверные'),qty:room.trims.length,unit:'пог.м',price:room.trims.price});
  if(room.floor.on){if(room.floor.cut45.on&&room.floor.cut45.length>0)pos.push({name:'Рез 45° (пол)',qty:room.floor.cut45.length,unit:'м',price:room.floor.cut45.price});if(room.floor.cutting.on&&room.floor.cutting.length>0)pos.push({name:'Резка плитки (пол)',qty:room.floor.cutting.length,unit:'м',price:room.floor.cutting.price});}
  if(room.wallsOn){room.walls.forEach(w=>{const lbl=w.label?` (${w.label})`:'';if(w.cut45.on&&w.cut45.length>0)pos.push({name:'Рез 45° стены'+lbl,qty:w.cut45.length,unit:'м',price:w.cut45.price});if(w.cutting.on&&w.cutting.length>0)pos.push({name:'Резка плитки стены'+lbl,qty:w.cutting.length,unit:'м',price:w.cutting.price});});}
  if(room.trims.on){if(room.trims.cut45.on&&room.trims.cut45.length>0)pos.push({name:'Рез 45° (откосы)',qty:room.trims.cut45.length,unit:'м',price:room.trims.cut45.price});if(room.trims.cutting.on&&room.trims.cutting.length>0)pos.push({name:'Резка плитки (откосы)',qty:room.trims.cutting.length,unit:'м',price:room.trims.cutting.price});}
  if(room.shower.on){if(room.shower.trapQty>0)pos.push({name:'Установка трапа',qty:room.shower.trapQty,unit:'шт',price:room.shower.trapPrice});if(room.shower.cut45>0)pos.push({name:'Рез 45° (поддон)',qty:room.shower.cut45,unit:'м',price:room.shower.cut45Price});if(room.shower.cutting>0)pos.push({name:'Подрезы плитки (поддон)',qty:room.shower.cutting,unit:'м',price:room.shower.cuttingPrice});if(room.shower.hydro>0)pos.push({name:'Гидроизоляция поддона',qty:room.shower.hydro,unit:'м²',price:room.shower.hydroPrice});}
  if(room.grout.on){let a=0;if(room.floor.on)a+=+room.floor.area;if(room.wallsOn)room.walls.forEach(w=>a+=+w.area);if(a>0)pos.push({name:'Затирка плитки',qty:Math.round(a*100)/100,unit:'м²',price:room.grout.price});}
  if(room.holes.on&&room.holes.qty>0) pos.push({name:'Выпиливание отверстий',qty:room.holes.qty,unit:'шт',price:room.holes.price});
  // Сантехника
  if(room.sanitary.on) room.sanitary.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name+(i.note?' ('+i.note+')':''),qty:i.qty,unit:i.unit,price:i.price}));
  // Электрика
  if(room.electric.on) room.electric.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name,qty:i.qty,unit:i.unit,price:i.price}));
  // Люки
  if(room.hatches.on) room.hatches.items.filter(i=>i.on&&i.qty>0).forEach(i=>{
    pos.push({name:i.name+(i.note?' ('+i.note+')':''),qty:i.qty,unit:i.unit,price:i.price});
    if(i.hatchCut&&i.hatchCutLen>0) pos.push({name:'Рез плитки под люк ('+i.name+')',qty:i.hatchCutLen,unit:'пог.м',price:i.hatchCutPrice||1200});
  });
  // ГКЛ/Металлоконструкции
  if(room.gkl.on) room.gkl.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name,qty:i.qty,unit:i.unit,price:i.price}));
  // Разводка
  if(room.pipes.on){
    if(room.pipes.hvsLen>0)   pos.push({name:'Разводка ХВС',qty:room.pipes.hvsLen,unit:'пог.м',price:room.pipes.hvsPrice});
    if(room.pipes.gvsLen>0)   pos.push({name:'Разводка ГВС',qty:room.pipes.gvsLen,unit:'пог.м',price:room.pipes.gvsPrice});
    if(room.pipes.kanLen>0)   pos.push({name:'Разводка канализации',qty:room.pipes.kanLen,unit:'пог.м',price:room.pipes.kanPrice});
    if(room.pipes.hvsPoints>0) pos.push({name:'Подключение ХВС (водорозетки)',qty:room.pipes.hvsPoints,unit:'шт',price:room.pipes.hvsPointPrice});
    if(room.pipes.gvsPoints>0) pos.push({name:'Подключение ГВС (водорозетки)',qty:room.pipes.gvsPoints,unit:'шт',price:room.pipes.gvsPointPrice});
    if(room.pipes.kanPoints>0) pos.push({name:'Подключение канализации (точки слива)',qty:room.pipes.kanPoints,unit:'шт',price:room.pipes.kanPointPrice});
    if(room.pipes.meters.on&&room.pipes.meters.qty>0) pos.push({name:'Монтаж счётчиков ХВС/ГВС'+(room.pipes.meters.note?' ('+room.pipes.meters.note+')':''),qty:room.pipes.meters.qty,unit:'шт',price:room.pipes.meters.price});
    if(room.pipes.filters.on&&room.pipes.filters.qty>0) pos.push({name:'Монтаж магистральных фильтров'+(room.pipes.filters.note?' ('+room.pipes.filters.note+')':''),qty:room.pipes.filters.qty,unit:'шт',price:room.pipes.filters.price});
  }
  // Мусор
  if(room.trash.on){
    if(room.trash.large.on&&room.trash.large.qty>0)   pos.push({name:'Вывоз крупногабаритного мусора',qty:room.trash.large.qty,unit:'м³',price:room.trash.large.price});
    if(room.trash.regular.on&&room.trash.regular.qty>0) pos.push({name:'Вывоз строительного мусора',qty:room.trash.regular.qty,unit:'м³',price:room.trash.regular.price});
  }
  // Доп. позиции
  room.custom.items.filter(i=>i.on&&i.qty>0).forEach(i=>pos.push({name:i.name,qty:i.qty,unit:i.unit,price:i.price}));
  return pos;
}
const roomTotal=r=>getPositions(r).reduce((s,p)=>s+p.qty*p.price,0);
const grandTotal=()=>rooms.reduce((s,r)=>s+roomTotal(r),0);

function render(){document.getElementById('roomsWrap').innerHTML='';rooms.forEach(r=>document.getElementById('roomsWrap').appendChild(buildRoom(r)));updateTotals();}
function updateTotals(){const g=grandTotal();document.getElementById('topSum').textContent=fmt(g)+' ₽';document.getElementById('footerAmt').textContent=fmt(g)+' ₽';}

      <label class="sw"><input type="checkbox" ${item.on?'checked':''} onchange="setItemField('${rid}','${key}','${item.id}','on',this.checked)"><div class="sw-track"></div></label>

      <button class="i-del" onclick="delItem('${rid}','${key}','${item.id}')">×</button>
    </div>
    <div class="item-card-bot">
      <input class="i-num" type="number" min="0" step="0.01" value="${item.qty||''}" placeholder="0" oninput="setItemField('${rid}','${key}','${item.id}','qty',+this.value)">
      <select class="unit-sel" onchange="setItemField('${rid}','${key}','${item.id}','unit',this.value)">${uSel}</select>
      <span class="i-unit-lbl">×</span>
      <input class="i-price" type="number" min="0" step="100" value="${item.price||''}" placeholder="цена" oninput="setItemField('${rid}','${key}','${item.id}','price',+this.value)">
      <span class="i-unit-lbl">₽</span>
      ${item.on&&item.qty&&item.price?`<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent)">${Math.round(item.qty*item.price).toLocaleString('ru-RU')} ₽</span>`:''}

    ${showNote&&item.on?`<div class="item-note-row"><input class="item-note-inp" value="${esc(item.note)}" placeholder="Примечание: подвесной / встраиваемый / скрытый монтаж…" oninput="setItemField('${rid}','${key}','${item.id}','note',this.value)"></div>`:''}
  </div>`;
}

function addRoom(){const r=makeRoom();rooms.push(r);render();setTimeout(()=>{const i=document.querySelector('#room_'+r.id+' .room-name-inp');if(i)i.focus();},60);}
function delRoom(id){rooms=rooms.filter(r=>r.id!==id);render();}
function toggleRoom(id){const r=rooms.find(r=>r.id===id);r.collapsed=!r.collapsed;document.getElementById('room_'+id).classList.toggle('collapsed',r.collapsed);}
function toggleSec(e,rid,sec){
  if(e.target.closest('.sw'))return;
  const r=rooms.find(r=>r.id===rid);
  if(sec==='floor'){setFloor(rid,'on',!r.floor.on);}
  else if(sec==='walls'){setRoomProp(rid,'wallsOn',!r.wallsOn);}
  else if(sec==='trims'){setTrim(rid,'on',!r.trims.on);}
  else if(['demo','prep','sanitary','electric','hatches','gkl','pipes','trash'].includes(sec)){setRoomProp(rid,sec+'.on',!r[sec].on);}
}
function setRoomName(id,v){rooms.find(r=>r.id===id).name=v;updateTotals();}
function setRoomProp(id,f,v){
  const r=rooms.find(r=>r.id===id);
  if(f.includes('.')){const[a,b]=f.split('.');r[a][b]=v;}else{r[f]=v;}
  rerenderRoom(id);
}
function setFloor(id,f,v){
  const fl=rooms.find(r=>r.id===id).floor;
  if(f.startsWith('cut_')){const[,sub,field]=f.split('_');fl[sub][field]=v;}
  else fl[f]=v;
  rerenderRoom(id);
}
function setTrim(id,f,v){rooms.find(r=>r.id===id).trims[f]=v;rerenderRoom(id);}
function setTrimCut(id,sub,f,v){rooms.find(r=>r.id===id).trims[sub][f]=v;rerenderRoom(id);}
function setWall(rid,wid,f,v){rooms.find(r=>r.id===rid).walls.find(w=>w.id===wid)[f]=v;rerenderRoom(rid);}
function setWallCut(rid,wid,sub,f,v){rooms.find(r=>r.id===rid).walls.find(w=>w.id===wid)[sub][f]=v;rerenderRoom(rid);}
function addWall(rid){rooms.find(r=>r.id===rid).walls.push(makeWall());rerenderRoom(rid);}
function delWall(rid,wid){const r=rooms.find(r=>r.id===rid);r.walls=r.walls.length===1?[makeWall()]:r.walls.filter(w=>w.id!==wid);rerenderRoom(rid);}
function setExtra(rid,k,f,v){rooms.find(r=>r.id===rid)[k][f]=v;rerenderRoom(rid);}

function setHydro(rid,f,v){rooms.find(r=>r.id===rid).hydro[f]=v;rerenderRoom(rid);}
function setItemField(rid,key,iid,f,v){
  const r=rooms.find(r=>r.id===rid);
  const item=r[key].items.find(i=>i.id===iid);
  if(item){item[f]=v;rerenderRoom(rid);}
}
function addItem(rid,key){
  rooms.find(r=>r.id===rid)[key].items.push(makeItem('',1,'шт',0,true));
  rerenderRoom(rid);
  setTimeout(()=>{const rows=document.querySelectorAll('#room_'+rid+' #irow_'+rooms.find(r=>r.id===rid)[key].items.slice(-1)[0].id+' .item-name-inp');if(rows.length)rows[0].focus();},60);
}
function delItem(rid,key,iid){
  const r=rooms.find(r=>r.id===rid);
  r[key].items=r[key].items.filter(i=>i.id!==iid);
  rerenderRoom(rid);
}
function rerenderRoom(id){const r=rooms.find(r=>r.id===id),o=document.getElementById('room_'+id);if(!o)return;o.replaceWith(buildRoom(r));updateTotals();}

function copyKP(){
  const addr=document.getElementById('mAddr').value.trim(),cli=document.getElementById('mClient').value.trim(),date=document.getElementById('mDate').value.trim();
  let lines=['КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ'];
  if(date)lines.push('Дата: '+date);if(addr)lines.push('Адрес: '+addr);if(cli)lines.push('Заказчик: '+cli);
  lines.push('','№\tНаименование\tКол-во\tЕд.\tЦена без НДС\tСумма без НДС');
  let grand=0;
  rooms.forEach(room=>{const pos=getPositions(room);if(!pos.length)return;lines.push('','─── '+(room.name||'Помещение').toUpperCase()+' ───');pos.forEach((p,i)=>{const s=p.qty*p.price;lines.push([i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(s)].join('\t'));grand+=s;});lines.push('\t\t\t\tИтого по разделу:\t'+fmtN(pos.reduce((s,p)=>s+p.qty*p.price,0)));});
  lines.push('','══════════════════════════════','\t\t\t\tИТОГО БЕЗ НДС:\t'+fmtN(grand),'НДС не облагается.');
  navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('Скопировано!'));
}
function copyTSV(){
  let rows=[['Помещение','№','Наименование','Кол-во','Ед.','Цена без НДС','Сумма без НДС']];
  rooms.forEach(room=>{const pos=getPositions(room);pos.forEach((p,i)=>rows.push([room.name,i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(p.qty*p.price)]));if(pos.length)rows.push([room.name,'','Итого:','','','',fmtN(pos.reduce((s,p)=>s+p.qty*p.price,0))]);});
  rows.push(['','','ИТОГО:','','','',fmtN(grandTotal())]);
  navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n')).then(()=>toast('TSV скопирован — вставьте в Excel'));
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const fmtQ=n=>(Math.round(n*1000)/1000).toString().replace('.',',');
const fmtN=n=>(Math.round(n*100)/100).toString().replace('.',',');
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const d=new Date();
  document.getElementById('mDate').value=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
  render();
})();
</script>
