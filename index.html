<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КП — Плитка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:13px/1.4 sans-serif;padding:6px;background:#f0f2f5;padding-bottom:72px}
input,select,button{font:inherit}
.meta{display:flex;flex-wrap:wrap;gap:6px;background:#fff;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:8px}
.meta input{border:1px solid #ccc;padding:5px 7px;border-radius:3px;width:180px;font-size:15px}
.meta label{font-size:11px;color:#666;display:block;margin-bottom:2px}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.btn{padding:7px 13px;cursor:pointer;font-size:13px;border:1px solid #aaa;background:#fff;border-radius:4px;white-space:nowrap;-webkit-appearance:none}
.btn-add{background:#e8f5e9;border-color:#81c784}
.bp{background:#1565c0;color:#fff;border-color:#1565c0}
/* Помещение */
.room-block{border:2px solid #1565c0;border-radius:6px;margin-bottom:14px;background:#fff;overflow:hidden}
.room-head{display:flex;align-items:center;gap:8px;background:#1565c0;color:#fff;padding:6px 10px}
.room-head input{background:transparent;color:#fff;border:none;font:700 15px sans-serif;flex:1;min-width:0}
.room-head input::placeholder{color:rgba(255,255,255,.5)}
.rtotal{font:700 15px monospace;white-space:nowrap}
.rdel{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;cursor:pointer;padding:3px 8px;font-size:12px}
/* Секции */
.sec{border-bottom:1px solid #e8e8e8}
.sec:last-child{border-bottom:none}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;color:#fff;user-select:none;-webkit-user-select:none}
.sec-head:active{filter:brightness(.88)}
.sec-lbl{flex:1;font:700 12px sans-serif;text-transform:uppercase;letter-spacing:.4px}
.sec-head input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex-shrink:0}
.sec-body{display:none}
.sec-body.open{display:block}
/* Item строки */
.irow{border-bottom:1px solid #f0f0f0;padding:4px 8px 6px}
.irow:last-child{border-bottom:none}
.irow-top{display:flex;align-items:center;gap:6px;min-height:38px}
.irow-bot{display:flex;align-items:center;gap:5px;padding:3px 0 2px 26px;flex-wrap:wrap}
.iname{flex:1;border:none;background:transparent;font-size:15px;min-width:0;padding:2px 0;color:#111}
.iname:focus{background:#fffde7;outline:1px solid #fbc02d;border-radius:3px;padding:2px 5px}
.iname::placeholder{color:#bbb}
.idel{background:none;border:none;cursor:pointer;color:#ccc;font-size:19px;padding:0 3px;line-height:1;flex-shrink:0}
.idel:active{color:#e53935}
/* Числовые поля */
.inum{width:66px;border:1px solid #ddd;border-radius:3px;text-align:right;font-size:15px;padding:4px 5px;background:#fff;-webkit-appearance:none}
.inum:focus{border-color:#1565c0;background:#fffde7;outline:none}
.iunit{border:1px solid #ddd;border-radius:3px;font-size:12px;padding:4px 3px;background:#fff;min-width:58px}
.isym{font-size:12px;color:#999}
.isum{min-width:72px;text-align:right;font:700 13px monospace;color:#1565c0}
/* Зона (пол / стена) */
.zone-block{border-bottom:1px solid #f0f0f0}
.zone-block:last-child{border-bottom:none}
.zone-row{display:flex;align-items:center;gap:6px;padding:5px 8px;flex-wrap:wrap}
.zone-tile{flex:1;border:none;background:transparent;font-size:15px;min-width:120px;padding:2px 0;color:#111}
.zone-tile:focus{background:#fffde7;outline:1px solid #fbc02d;border-radius:3px;padding:2px 5px}
.zone-tile::placeholder{color:#bbb}
.zone-lbl{width:80px;border:none;background:transparent;font-size:13px;color:#888;padding:2px 0}
.zone-lbl:focus{background:#fffde7;outline:1px solid #fbc02d;border-radius:3px;padding:2px 4px}
.zone-lbl::placeholder{color:#ccc}
.zone-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:19px;padding:0 3px;line-height:1}
.zone-del:active{color:#e53935}
/* Рез / резка subrow */
.subrow{display:flex;align-items:center;gap:5px;padding:3px 8px 4px 28px;background:#f9f9f9;border-top:1px solid #f0f0f0;flex-wrap:wrap}
.sub-lbl{font-size:12px;color:#999;width:70px;flex-shrink:0}
/* Итого */
.tot-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 12px;background:#fff9c4;border-top:1px solid #e0e0e0}
.tot-lbl{font-size:12px;color:#666}
.tot-val{font:700 16px monospace;color:#1565c0}
.add-zone-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:none;border:1.5px dashed #ccc;border-radius:4px;color:#888;font-size:13px;padding:8px;cursor:pointer;margin:0}
.add-zone-btn:active{border-color:#1565c0;color:#1565c0;background:#f0f4fa}
/* Гидро / мусор — простые строки */
.plain-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.plain-row:last-child{border-bottom:none}
.plain-lbl{flex:1;font-size:14px;min-width:80px}
/* Итого-помещения */
.room-tot{display:flex;justify-content:flex-end;align-items:center;gap:10px;background:#fff9c4;padding:8px 14px;font-weight:700}
/* Футер */
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #1565c0;padding:7px 12px;display:flex;align-items:center;gap:12px;z-index:99}
.gtotal{font:700 22px monospace;color:#1565c0}
</style>
</head>
<body>

<div class="meta">
  <div><label>Адрес</label><input id="mAddr" placeholder="г. Санкт-Петербург…"></div>
  <div><label>Заказчик</label><input id="mClient" placeholder="ФИО / организация"></div>
  <div><label>Дата</label><input id="mDate"></div>
</div>
<div class="bar">
  <button class="btn bp" onclick="addRoom()">＋ Помещение</button>
  <button class="btn bp" onclick="copyKP()">📋 КП текст</button>
  <button class="btn bp" onclick="copyTSV()">📊 Excel</button>
  <button class="btn" onclick="exportJSON()">💾 JSON</button>
  <button class="btn" onclick="importJSON()">📥 Импорт</button>
</div>

<div id="wrap"></div>
<div class="footer">
  <span style="font-size:12px;color:#888">ИТОГО без НДС:</span>
  <span class="gtotal" id="gt">0 ₽</span>
</div>
<input type="file" id="fi" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
'use strict';
var _uid=0;
function uid(){return 'u'+(++_uid);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function fmtN(n){return(Math.round(n*100)/100).toString().replace('.',',');}
var KEY='kp-v5',META=['mAddr','mClient','mDate'];
var UNITS=['м²','пог.м','шт','м','объём'];

function mi(name,qty,unit,price,on){return{id:uid(),name:name,qty:qty,unit:unit,price:price,on:on||false,note:''};}
// Зона пола/стены
function mz(isFloor){return{id:uid(),label:'',tile:'',area:0,price:isFloor?6500:8000,c4on:false,c4l:0,c4p:1200,con:false,cl:0,cp:1000};}

function makeRoom(name){return{
  id:uid(),name:name||'',
  demo:{on:true,cl:false,items:[mi('Демонтаж плитки с пола',0,'м²',170),mi('Демонтаж плитки со стен',0,'м²',170),mi('Демонтаж потолка',0,'м²',170),mi('Демонтаж сантехники',1,'шт',500)]},
  prep:{on:false,cl:true,items:[mi('Грунтовка пола',0,'м²',80),mi('Грунтовка стен',0,'м²',80),mi('Подготовка стен',0,'м²',170),mi('Выравнивание стен',0,'м²',350)]},
  hydro:{cl:true,fon:false,fa:0,fp:300,won:false,wa:0,wp:200},
  // floors — массив зон пола
  floors:[mz(true)],floorsOn:true,floorsCl:false,
  // walls — массив зон стен
  walls:[mz(false)],wOn:true,wCl:false,
  trims:{on:false,cl:true,len:0,price:1200,tile:'',c4on:false,c4l:0,c4p:1200,con:false,cl:0,cp:1000},
  shower:{on:false,cl:true,tq:1,tp:2500,c4:0,c4p:1200,cut:0,cutp:1000,hydro:0,hp:300},
  grout:{on:true,price:1300},
  holes:{on:false,qty:0,price:1700},
  hatches:{on:false,cl:true,items:[mi('Люк (стандартный)',1,'шт',0)]},
  gkl:{on:false,cl:true,items:[mi('Металлоконструкция (каркас)',0,'м²',0),mi('Обшивка ГКЛ',0,'м²',0),mi('Обшивка ГВЛ',0,'м²',0),mi('Формирование угла',0,'пог.м',0)]},
  sanitary:{on:false,cl:true,items:[mi('Установка унитаза',1,'шт',1200),mi('Установка ванны / поддона',1,'шт',1800),mi('Установка смесителя',1,'шт',600),mi('Установка раковины',1,'шт',1300),mi('Монтаж полотенцесушителя',1,'шт',1500),mi('Монтаж вентилятора',1,'шт',450)]},
  electric:{on:false,cl:true,items:[]},
  trash:{on:false,cl:true,large:{on:false,qty:0,price:0},regular:{on:false,qty:0,price:0}},
  custom:{cl:false,items:[]}
};}

var rooms=[];

// ── Расчёт ──
function getPos(r){
  var P=[];
  function p(n,q,u,pr){if(+q>0&&+pr>0)P.push({name:n,qty:+q,unit:u,price:+pr});}
  if(r.demo.on)(r.demo.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.prep.on)(r.prep.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.hydro.fon&&+r.hydro.fa>0)p('Гидроизоляция пола',r.hydro.fa,'м²',r.hydro.fp);
  if(r.hydro.won&&+r.hydro.wa>0)p('Гидроизоляция стен',r.hydro.wa,'м²',r.hydro.wp);
  // Пол — несколько зон
  if(r.floorsOn)(r.floors||[]).forEach(function(f,idx){
    if(!+f.area)return;
    var nm=f.tile?'Укладка '+f.tile+' (пол)':'Укладка плитки на пол';
    if(f.label)nm='Укладка '+(f.tile||'плитки')+' — '+f.label;
    p(nm,f.area,'м²',f.price);
    if(f.c4on&&+f.c4l>0)p('Рез 45° (пол'+(f.label?' '+f.label:idx>0?' зона '+(idx+1):'')+')' ,f.c4l,'м',f.c4p);
    if(f.con&&+f.cl>0)p('Резка плитки (пол'+(f.label?' '+f.label:idx>0?' зона '+(idx+1):'')+')' ,f.cl,'м',f.cp);
  });
  // Стены — несколько зон
  if(r.wOn)(r.walls||[]).forEach(function(w,idx){
    if(!+w.area)return;
    var nm=(w.tile?'Укладка '+w.tile:'Укладка плитки')+(w.label?' — '+w.label:' (стены)');
    p(nm,w.area,'м²',w.price);
    if(w.c4on&&+w.c4l>0)p('Рез 45° стены'+(w.label?' ('+w.label+')':''),w.c4l,'м',w.c4p);
    if(w.con&&+w.cl>0)p('Резка плитки стены'+(w.label?' ('+w.label+')':''),w.cl,'м',w.cp);
  });
  // Откосы
  if(r.trims.on&&+r.trims.len>0){
    p(r.trims.tile?'Откосы ('+r.trims.tile+')':'Откосы дверные',r.trims.len,'пог.м',r.trims.price);
    if(r.trims.c4on&&+r.trims.c4l>0)p('Рез 45° (откосы)',r.trims.c4l,'м',r.trims.c4p);
    if(r.trims.con&&+r.trims.cl>0)p('Резка плитки (откосы)',r.trims.cl,'м',r.trims.cp);
  }
  // Поддон
  if(r.shower.on){
    if(+r.shower.tq>0)p('Установка трапа',r.shower.tq,'шт',r.shower.tp);
    if(+r.shower.c4>0)p('Рез 45° (поддон)',r.shower.c4,'м',r.shower.c4p);
    if(+r.shower.cut>0)p('Резка плитки (поддон)',r.shower.cut,'м',r.shower.cutp);
    if(+r.shower.hydro>0)p('Гидроизоляция поддона',r.shower.hydro,'м²',r.shower.hp);
  }
  // Затирка авто
  var ga=0;
  if(r.floorsOn)(r.floors||[]).forEach(function(f){ga+=+f.area||0;});
  if(r.wOn)(r.walls||[]).forEach(function(w){ga+=+w.area||0;});
  ga=Math.round(ga*100)/100;
  if(r.grout.on&&ga>0)p('Затирка плитки',ga,'м²',r.grout.price);
  if(r.holes.on&&+r.holes.qty>0)p('Выпиливание отверстий',r.holes.qty,'шт',r.holes.price);
  if(r.hatches.on)(r.hatches.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.gkl.on)(r.gkl.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.sanitary.on)(r.sanitary.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name+(i.note?' ('+i.note+')':''),i.qty,i.unit,i.price);});
  if(r.electric.on)(r.electric.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  if(r.trash.on){
    if(r.trash.large.on&&+r.trash.large.qty>0)p('Вывоз крупногабаритного мусора',r.trash.large.qty,'м³',r.trash.large.price);
    if(r.trash.regular.on&&+r.trash.regular.qty>0)p('Вывоз строительного мусора',r.trash.regular.qty,'м³',r.trash.regular.price);
  }
  (r.custom.items||[]).filter(function(i){return i.on&&+i.qty>0;}).forEach(function(i){p(i.name,i.qty,i.unit,i.price);});
  return P;
}
function rTotal(r){return getPos(r).reduce(function(s,p){return s+p.qty*p.price;},0);}
function gTotal(){return rooms.reduce(function(s,r){return s+rTotal(r);},0);}

// ── Хранение ──
var saveT=null;
function sched(){clearTimeout(saveT);saveT=setTimeout(save,600);}
function save(){var m={};META.forEach(function(k){m[k]=document.getElementById(k).value||'';});try{localStorage.setItem(KEY,JSON.stringify({v:1,m:m,rooms:rooms,uid:_uid}));}catch(e){}}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d||!d.rooms)return false;
    if(d.uid)_uid=d.uid;
    rooms=d.rooms.map(mg);
    if(d.m)META.forEach(function(k){var el=document.getElementById(k);if(el&&d.m[k]!=null)el.value=d.m[k];});
    return true;
  }catch(e){return false;}
}
function mg(r){
  if(!r)return makeRoom();
  var t=makeRoom();
  Object.keys(t).forEach(function(k){if(r[k]==null)r[k]=t[k];});
  // Миграция floor → floors
  if(!Array.isArray(r.floors)){
    if(r.floor&&typeof r.floor==='object'){
      var f=mz(true);
      f.area=r.floor.area||0;f.price=r.floor.price||6500;f.tile=r.floor.tile||'';
      f.c4on=r.floor.c4on||false;f.c4l=r.floor.c4l||0;f.c4p=r.floor.c4p||1200;
      f.con=r.floor.con||false;f.cl=r.floor.cl2||r.floor.cl||0;f.cp=r.floor.cp||1000;
      r.floors=[f];r.floorsOn=r.floor.on!==false;r.floorsCl=r.floor.cl||false;
    }else{r.floors=[mz(true)];r.floorsOn=true;r.floorsCl=false;}
  }
  if(r.floorsCl==null)r.floorsCl=false;
  if(!Array.isArray(r.walls)||!r.walls.length)r.walls=[mz(false)];
  // Добавить поля c4 в стены если нет
  r.walls.forEach(function(w){if(w.c4on==null)w.c4on=false;if(w.c4l==null)w.c4l=0;if(w.c4p==null)w.c4p=1200;if(w.con==null)w.con=false;if(w.cl==null)w.cl=0;if(w.cp==null)w.cp=1000;});
  // Добавить поля c4 в полы если нет
  r.floors.forEach(function(f){if(f.c4on==null)f.c4on=false;if(f.c4l==null)f.c4l=0;if(f.c4p==null)f.c4p=1200;if(f.con==null)f.con=false;if(f.cl==null)f.cl=0;if(f.cp==null)f.cp=1000;});
  ['demo','prep','hatches','gkl','sanitary','electric','custom'].forEach(function(k){
    if(!r[k])r[k]=t[k];else{if(r[k].cl==null)r[k].cl=true;if(!Array.isArray(r[k].items))r[k].items=t[k].items;}
  });
  if(!r.hydro)r.hydro=t.hydro;else{if(r.hydro.fon==null)r.hydro.fon=r.hydro.on||false;if(r.hydro.won==null)r.hydro.won=false;if(r.hydro.cl==null)r.hydro.cl=true;}
  if(!r.trims)r.trims=t.trims;else Object.keys(t.trims).forEach(function(k){if(r.trims[k]==null)r.trims[k]=t.trims[k];});
  if(!r.shower)r.shower=t.shower;else Object.keys(t.shower).forEach(function(k){if(r.shower[k]==null)r.shower[k]=t.shower[k];});
  if(!r.grout)r.grout=t.grout;if(!r.holes)r.holes=t.holes;if(!r.trash)r.trash=t.trash;if(!r.custom)r.custom=t.custom;
  return r;
}

// ── Рендер ──
function getRoom(rid){return rooms.filter(function(x){return x.id===rid;})[0];}

function render(){
  var w=document.getElementById('wrap');w.innerHTML='';
  rooms.forEach(function(r){try{w.appendChild(buildRoom(r));}catch(e){console.error('buildRoom',e);}});
  document.getElementById('gt').textContent=fmt(gTotal())+' ₽';
  sched();
}

// КЛЮЧЕВОЙ ФИХ: сохранять фокус при ререндере
function rr(rid){
  var act=document.activeElement;
  var fid=act?act.getAttribute('data-fid'):null;
  var ss=act&&act.selectionStart!=null?act.selectionStart:null;
  var se=act&&act.selectionEnd!=null?act.selectionEnd:null;
  var r=getRoom(rid),old=document.getElementById('room_'+rid);
  if(r&&old){try{old.parentNode.replaceChild(buildRoom(r),old);}catch(e){console.error(e);}}
  document.getElementById('gt').textContent=fmt(gTotal())+' ₽';
  if(fid){
    var el=document.querySelector('[data-fid="'+fid+'"]');
    if(el){el.focus();try{if(ss!=null&&el.setSelectionRange&&el.type!=='number')el.setSelectionRange(ss,se);}catch(e){}}
  }
  sched();
}

function usel(val,cb){
  return '<select class="iunit" onchange="'+cb+'">'
    +UNITS.map(function(u){return'<option'+(u===val?' selected':'')+'>'+u+'</option>';}).join('')
    +'</select>';
}
function sv(on,a,b){return on&&+a&&+b?fmt((+a)*(+b)):''}

// Заголовок секции
function secHead(bg,swHtml,lbl,open,onclk){
  return '<div class="sec-head" style="background:'+bg+'" onclick="'+onclk+'">'
    +swHtml+'<span class="sec-lbl">'+(open?'▼ ':'▶ ')+lbl+'</span></div>';
}
function swCb(rid,key,checked){
  return'<input type="checkbox"'+(checked?' checked':'')+' onclick="event.stopPropagation()"'
    +' onchange="secOn(\''+rid+'\',\''+key+'\',this.checked)" style="width:16px;height:16px;flex-shrink:0">';
}

// Строка позиции (для списочных секций)
function irow(rid,sec,it,showNote){
  var s=it.on&&+it.qty&&+it.price?fmt((+it.qty)*(+it.price)):'';
  var fbase=rid+':'+sec+':'+it.id;
  var r='<div class="irow">'
    +'<div class="irow-top">'
    +'<input type="checkbox" style="width:16px;height:16px;flex-shrink:0"'+(it.on?' checked':'')+' onchange="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'on\',this.checked)">'
    +'<input class="iname" data-fid="'+fbase+':name" value="'+esc(it.name)+'" placeholder="Наименование" oninput="SF(\''+rid+'\',\''+sec+'\',\''+it.id+'\',\'name\',this.value)">'
    +'<button class="idel" onclick="delI(\''+rid+'\',\''+sec+'\',\''+it.id+'\')">✕</button>'
    +'</div>'
    +'<div class="irow-bot">'

  h+=sec('#558b2f',swCb(r.id,'trash',r.trash.on),'Вывоз мусора',!r.trash.cl,'toggleCl(\''+r.id+'\',\'trash\')',trashBody,'');
  // ПРОЧЕЕ
  h+=sec('#455a64','','Прочие работы',!r.custom.cl,'toggleCl(\''+r.id+'\',\'custom\')',ilist(r.id,'custom',r.custom.items),'<div style="padding:6px 8px"><button class="add-zone-btn" onclick="addI(\''+r.id+'\',\'custom\')">＋ строка</button></div>');
  // ИТОГО ПОМЕЩЕНИЯ
  h+='<div class="room-tot"><span style="font-size:13px;color:#888">Итого по помещению:</span><span style="font:700 18px monospace;color:#1565c0">'+fmt(tot)+' ₽</span></div>';

  el.innerHTML=h;
  return el;
}

// ── Setters ──
function setName(id,v){var r=getRoom(id);r.name=v;var el=document.querySelector('#room_'+id+' .rtotal');if(el)el.textContent=fmt(rTotal(r))+' ₽';document.getElementById('gt').textContent=fmt(gTotal())+' ₽';sched();}

function secOn(rid,key,v){
  var r=getRoom(rid);
  if(key==='floorsOn')r.floorsOn=v;
  else if(key==='wOn')r.wOn=v;
  else if(key==='trims')r.trims.on=v;
  else if(r[key]&&'on' in r[key])r[key].on=v;
  rr(rid);
}
function toggleCl(rid,key){
  var r=getRoom(rid);
  if(key==='floorsCl')r.floorsCl=!r.floorsCl;
  else if(key==='wCl')r.wCl=!r.wCl;
  else if(key==='trims')r.trims.cl=!r.trims.cl;
  else if(key==='hydro')r.hydro.cl=!r.hydro.cl;
  else r[key].cl=!r[key].cl;
  rr(rid);
}
function setZF(rid,fid,f,v){var fl=getRoom(rid).floors.filter(function(x){return x.id===fid;})[0];if(fl){fl[f]=v;rr(rid);}}
function setZW(rid,wid,f,v){var w=getRoom(rid).walls.filter(function(x){return x.id===wid;})[0];if(w){w[f]=v;rr(rid);}}
function addFloor(rid){getRoom(rid).floors.push(mz(true));rr(rid);}
function delFloor(rid,fid){var r=getRoom(rid);if(r.floors.length>1)r.floors=r.floors.filter(function(f){return f.id!==fid;});rr(rid);}
function addWall(rid){getRoom(rid).walls.push(mz(false));rr(rid);}
function delWall(rid,wid){var r=getRoom(rid);if(r.walls.length>1)r.walls=r.walls.filter(function(w){return w.id!==wid;});rr(rid);}
function setTrim(rid,f,v){getRoom(rid).trims[f]=v;rr(rid);}
function setH(rid,f,v){getRoom(rid).hydro[f]=v;rr(rid);}
function setSh(rid,f,v){getRoom(rid).shower[f]=v;rr(rid);}
function setGH(rid,key,f,v){getRoom(rid)[key][f]=v;rr(rid);}
function setTr(rid,sub,f,v){getRoom(rid).trash[sub][f]=v;rr(rid);}
function SF(rid,key,iid,f,v){var it=getRoom(rid)[key].items.filter(function(i){return i.id===iid;})[0];if(it){it[f]=v;rr(rid);}}
function addI(rid,key){getRoom(rid)[key].items.push(mi('',1,'шт',0,true));rr(rid);}
function delI(rid,key,iid){var r=getRoom(rid);r[key].items=r[key].items.filter(function(i){return i.id!==iid;});rr(rid);}
function addRoom(){var r=makeRoom();rooms.push(r);render();}
function delRoom(id){if(!confirm('Удалить помещение?'))return;rooms=rooms.filter(function(r){return r.id!==id;});render();}

// ── Экспорт ──
function copyKP(){
  var a=document.getElementById('mAddr').value,c=document.getElementById('mClient').value,d=document.getElementById('mDate').value;
  var L=['КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ'];
  if(d)L.push('Дата: '+d);if(a)L.push('Адрес: '+a);if(c)L.push('Заказчик: '+c);
  L.push('','№\tНаименование\tКол-во\tЕд.\tЦена\tСумма');
  var grand=0;
  rooms.forEach(function(r){var P=getPos(r);if(!P.length)return;L.push('','─── '+(r.name||'Помещение').toUpperCase()+' ───');var st=0;P.forEach(function(p,i){var s=p.qty*p.price;st+=s;grand+=s;L.push([i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(s)].join('\t'));});L.push('\t\t\t\tИтого:\t'+fmtN(st));});
  L.push('','ИТОГО БЕЗ НДС:\t'+fmtN(grand),'НДС не облагается.');
  var t=L.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){alert('КП скопировано!');}).catch(function(){fbCopy(t);});
  else fbCopy(t);
}
function fbCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Скопировано!');}catch(e){}document.body.removeChild(ta);}
function copyTSV(){
  var rows=[['Помещение','№','Наименование','Кол-во','Ед.','Цена','Сумма']];
  rooms.forEach(function(r){var P=getPos(r);P.forEach(function(p,i){rows.push([r.name,i+1,p.name,fmtN(p.qty),p.unit,fmtN(p.price),fmtN(p.qty*p.price)]);});if(P.length)rows.push([r.name,'','Итого:','','','',fmtN(P.reduce(function(s,p){return s+p.qty*p.price;},0))]);});
  rows.push(['','','ИТОГО:','','','',fmtN(gTotal())]);
  var t=rows.map(function(r){return r.join('\t');}).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){alert('Excel TSV скопирован!');}).catch(function(){fbCopy(t);});
  else fbCopy(t);
}
function exportJSON(){var m={};META.forEach(function(k){m[k]=document.getElementById(k).value||'';});var b=new Blob([JSON.stringify({v:1,m:m,rooms:rooms,uid:_uid},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kp-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);}
function importJSON(){document.getElementById('fi').click();}
function handleImport(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!d.rooms||!Array.isArray(d.rooms))throw new Error('Неверный формат');if(rooms.length>0&&!confirm('Заменить данные?'))return;if(d.uid)_uid=d.uid;rooms=d.rooms.map(mg);if(d.m)META.forEach(function(k){var el=document.getElementById(k);if(el&&d.m[k]!=null)el.value=d.m[k];});render();}catch(err){alert('Ошибка: '+err.message);}};rd.readAsText(f);e.target.value='';}

META.forEach(function(k){var el=document.getElementById(k);if(el)el.addEventListener('input',sched);});
if(!load()){document.getElementById('mDate').value=new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});}
render();
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('beforeunload',save);
